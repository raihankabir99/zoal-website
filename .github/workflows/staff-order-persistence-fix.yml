name: Staff Order Persistence Fix

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix

      - name: Apply guarded Staff order persistence patch
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/EnterpriseOrderManagement.tsx')
          s = p.read_text(encoding='utf-8')

          if "import { supabaseClient } from '../lib/supabaseClient';" not in s:
              marker = "import { downloadHtmlAsPdf } from '../lib/pdf';"
              if marker not in s:
                  raise SystemExit('Expected import marker not found; aborting.')
              s = s.replace(marker, marker + "\nimport { supabaseClient } from '../lib/supabaseClient';", 1)

          staff_marker = "  // Mock staff list for assignment\n  const STAFF_LIST = [\n    { id: 'st-1', name: 'Support Ahmad', email: 'ahmad@zoal.sa' },\n    { id: 'st-2', name: 'Master Roaster Khalid', email: 'khalid@zoal.sa' },\n    { id: 'st-3', name: 'Fulfillment Yasir', email: 'yasir@zoal.sa' },\n    { id: 'st-4', name: 'Logistics Hisham', email: 'hisham@zoal.sa' }\n  ];"
          staff_replacement = """  // Authoritative staff assignment list
  const [staffList, setStaffList] = useState<Array<{ id: string; name: string; email: string }>>([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const token = sessionData.session?.access_token;
      if (!token) return;
      const response = await fetch('/api/staff', {
        headers: { Authorization: `Bearer ${token}` },
        cache: 'no-store'
      });
      if (!response.ok) return;
      const payload = await response.json();
      const rows = Array.isArray(payload?.data) ? payload.data : Array.isArray(payload) ? payload : [];
      const mapped = rows.map((member: any) => ({
        id: String(member.id),
        name: [member.first_name, member.last_name].filter(Boolean).join(' ') || member.email,
        email: member.email || ''
      }));
      if (!cancelled) setStaffList(mapped);
    })().catch(() => undefined);
    return () => { cancelled = true; };
  }, []);"""
          if staff_marker in s:
              s = s.replace(staff_marker, staff_replacement, 1)
          elif 'const [staffList, setStaffList]' not in s:
              raise SystemExit('Expected STAFF_LIST block not found; aborting.')

          helper_marker = "  // Status Workflow transitions state machine validator"
          helper = """  const persistOrderOperation = async (payload: Record<string, any>) => {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const token = sessionData.session?.access_token;
    if (!token) throw new Error('Authenticated staff session required.');

    const response = await fetch('/api/staff', {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result?.error || result?.message || 'Failed to persist staff order operation.');
    return result?.data || result;
  };

"""
          if 'const persistOrderOperation = async' not in s:
              if helper_marker not in s:
                  raise SystemExit('Status validator marker not found; aborting.')
              s = s.replace(helper_marker, helper_marker + '\n' + helper, 1)

          status_pattern = re.compile(r"  const handleStatusTransition = \(orderId: string, nextStatus: Order\['status'\], noteText\?: string\) => \{.*?\n  \};\n\n  // Staff Assignment", re.S)
          status_replacement = """  const handleStatusTransition = async (orderId: string, nextStatus: Order['status'], noteText?: string) => {
    const orderToUpdate = orders.find(o => o.id === orderId);
    if (!orderToUpdate) return;

    const validTransitions = getValidTransitions(orderToUpdate.status);
    if (userRole !== 'admin' && !validTransitions.includes(nextStatus)) {
      alert(`Invalid status transition from ${orderToUpdate.status} to ${nextStatus}.`);
      return;
    }

    try {
      const persisted = await persistOrderOperation({
        orderId,
        status: nextStatus,
        ...(noteText ? { staffNotes: noteText } : {})
      });

      const dbToUi: Record<string, Order['status']> = {
        pending: 'Pending',
        processing: 'Processing',
        shipped: 'Shipped',
        delivered: 'Delivered',
        cancelled: 'Cancelled',
        refunded: 'Refund Completed',
        partially_refunded: 'Refund Approved',
        failed: 'Cancelled'
      };
      const persistedStatus = dbToUi[String(persisted?.status || '').toLowerCase()] || nextStatus;
      const paymentStatus = String(persisted?.payment_status || '').toLowerCase();
      const paymentUi = paymentStatus === 'paid' ? 'Paid' : paymentStatus === 'refunded' ? 'Refunded' : orderToUpdate.paymentStatus;

      setOrders(prev => prev.map(o => o.id === orderId ? {
        ...o,
        ...persisted,
        status: persistedStatus,
        paymentStatus: paymentUi,
        staffNotes: persisted?.staff_notes ?? o.staffNotes,
        assignedStaff: persisted?.assigned_staff_name ?? o.assignedStaff
      } : o));

      if (selectedOrder?.id === orderId) {
        setSelectedOrder(prev => prev ? {
          ...prev,
          ...persisted,
          status: persistedStatus,
          paymentStatus: paymentUi,
          staffNotes: persisted?.staff_notes ?? prev.staffNotes,
          assignedStaff: persisted?.assigned_staff_name ?? prev.assignedStaff
        } : null);
      }
    } catch (error: any) {
      alert(error?.message || 'Failed to save order status. No local change was applied.');
    }
  };

  // Staff Assignment"""
          if not status_pattern.search(s):
              raise SystemExit('Expected status handler signature/body not found; aborting.')
          s = status_pattern.sub(status_replacement, s, count=1)

          assign_pattern = re.compile(r"  const handleAssignStaff = \(orderId: string, staffName: string\) => \{.*?\n  \};\n\n  // Notes Updates", re.S)
          assign_replacement = """  const handleAssignStaff = async (orderId: string, staffName: string) => {
    try {
      const staff = staffList.find(member => member.name === staffName || member.email === staffName);
      const persisted = await persistOrderOperation({
        orderId,
        assignedStaffId: staff?.id,
        assignedStaffName: staffName
      });

      setOrders(prev => prev.map(o => o.id === orderId ? {
        ...o,
        ...persisted,
        assignedStaff: persisted?.assigned_staff_name || staffName
      } : o));
      if (selectedOrder?.id === orderId) {
        setSelectedOrder(prev => prev ? { ...prev, ...persisted, assignedStaff: persisted?.assigned_staff_name || staffName } : null);
      }
    } catch (error: any) {
      alert(error?.message || 'Failed to save staff assignment.');
    }
  };

  // Notes Updates"""
          if not assign_pattern.search(s):
              raise SystemExit('Expected staff assignment handler not found; aborting.')
          s = assign_pattern.sub(assign_replacement, s, count=1)

          notes_pattern = re.compile(r"  const handleSaveNotes = \(type: 'admin' \| 'staff' \| 'customer'\) => \{.*?\n  \};\n\n  // Stats Calculations", re.S)
          notes_replacement = """  const handleSaveNotes = async (type: 'admin' | 'staff' | 'customer') => {
    if (!selectedOrder) return;
    const value = type === 'admin' ? adminNoteInput : type === 'staff' ? staffNoteInput : customerNoteInput;
    const field = type === 'admin' ? 'adminNotes' : type === 'staff' ? 'staffNotes' : 'customerNotes';

    try {
      const persisted = await persistOrderOperation({ orderId: selectedOrder.id, [field]: value });
      setOrders(prev => prev.map(o => o.id === selectedOrder.id ? {
        ...o,
        ...persisted,
        [field]: persisted?.[field.replace(/[A-Z]/g, (m: string) => `_${m.toLowerCase()}`)] ?? value
      } : o));
      setSelectedOrder(prev => prev ? {
        ...prev,
        ...persisted,
        [field]: persisted?.[field.replace(/[A-Z]/g, (m: string) => `_${m.toLowerCase()}`)] ?? value
      } : null);
      alert(`${type.toUpperCase()} notes updated successfully.`);
    } catch (error: any) {
      alert(error?.message || 'Failed to save notes. No local change was applied.');
    }
  };

  // Stats Calculations"""
          if not notes_pattern.search(s):
              raise SystemExit('Expected notes handler not found; aborting.')
          s = notes_pattern.sub(notes_replacement, s, count=1)

          p.write_text(s, encoding='utf-8')

      - name: Verify
        run: |
          git diff --check
          npm ci
          npm run build

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseOrderManagement.tsx .github/workflows/staff-order-persistence-fix.yml
          git diff --cached --check
          git commit -m "fix(staff): persist order status assignment and notes" || exit 0
          git push origin audit/dashboard-sync-fix

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/staff-order-persistence-fix.yml || exit 0
          git commit -m "chore(audit): remove temporary staff remediation workflow" || exit 0
          git push origin audit/dashboard-sync-fix || true
