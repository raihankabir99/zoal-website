  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const response = await fetch('/api/brands', { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok || result?.success === false) throw new Error(result?.error || `Brand fetch failed (${response.status})`);
        if (!cancelled) setBrands(Array.isArray(result?.data) ? result.data.map(mapApiBrand) : []);
      } catch (error) { console.error('Brand management server sync failed:', error); }
    })();
    return () => { cancelled = true; };
  }, [setBrands]);

