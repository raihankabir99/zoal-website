name: Marketing Hardening Once

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  harden-marketing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact marketing hardening
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.ts')
          text = app.read_text(encoding='utf-8')
          old_campaign = "app.get('/api/marketing/campaigns', marketingModule.getCampaigns);"
          new_campaign = "app.get('/api/marketing/campaigns', authenticateRequest, requireRole(['admin', 'manager', 'staff']), marketingModule.getCampaigns);"
          old_coupon = "app.get('/api/marketing/coupons', marketingModule.getCoupons);"
          new_coupon = "app.get('/api/marketing/coupons', authenticateRequest, requireRole(['admin', 'manager', 'staff']), marketingModule.getCoupons);"
          assert text.count(old_campaign) == 1, 'Expected exactly one public campaign GET route'
          assert text.count(old_coupon) == 1, 'Expected exactly one public coupon GET route'
          text = text.replace(old_campaign, new_campaign).replace(old_coupon, new_coupon)
          app.write_text(text, encoding='utf-8')

          panel = Path('src/components/CampaignsMarketingPanel.tsx')
          p = panel.read_text(encoding='utf-8')
          old = '''                const subject = formData.get('newsletter_subject') as string;\n                if (!subject) return;\n                addLog(`Dispatched email newsletter: \\"${subject}\\" to ${subscribers.length} VIP patrons`, \\"Campaign Center\\");\n                alert(`Simulated dispatch sequence completed! Newsletter successfully sent to ${subscribers.length} verified email accounts.`);\n                e.currentTarget.reset();'''
          new = '''                const subject = formData.get('newsletter_subject') as string;\n                const body = formData.get('newsletter_body') as string;\n                if (!subject || !body) return;\n                try {\n                  const token = localStorage.getItem('zoal_auth_token');\n                  const res = await fetch('/api/marketing/email', {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },\n                    body: JSON.stringify({ campaign_id: null, subject, body })\n                  });\n                  const result = await res.json().catch(() => ({}));\n                  if (!res.ok) throw new Error(result.error || `Server error ${res.status}`);\n                  addLog(`Dispatched email newsletter: \\"${subject}\\" via marketing backend`, \\"Campaign Center\\");\n                  alert('Newsletter dispatch request accepted by the marketing backend.');\n                  e.currentTarget.reset();\n                } catch (error: any) {\n                  alert(`Newsletter dispatch failed: ${error.message}`);\n                }'''
          assert old in p, 'Newsletter simulated block not found exactly; refusing unsafe edit'
          p = p.replace(old, new, 1)
          if 'name="newsletter_body"' not in p:
            marker = '''<input type="text" name="newsletter_subject"'''
            idx = p.find(marker)
            assert idx >= 0, 'Newsletter subject field not found'
            end = p.find('/>', idx)
            assert end >= 0, 'Newsletter subject input terminator not found'
            insert = '''\n                <textarea name="newsletter_body" required placeholder="Newsletter content..." className="bg-black w-full border border-white/10 text-white p-2 text-[10px] rounded-xs outline-none focus:border-gold-pure font-mono min-h-24" />'''
            p = p[:end+2] + insert + p[end+2:]
          panel.write_text(p, encoding='utf-8')

      - name: Typecheck and production build
        run: npm run lint && npm run build

      - name: Commit verified hardening and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/marketing-hardening-once.yml
          git add app.ts src/components/CampaignsMarketingPanel.tsx .github/workflows/marketing-hardening-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(marketing): harden read access and remove simulated newsletter dispatch"
          git push origin audit/dashboard-sync-fix

# one-time retrigger
