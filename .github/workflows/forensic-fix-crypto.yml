name: Forensic Crypto Import Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  apply-crypto-import-fix:
    if: ${{ !contains(github.event.head_commit.message, 'apply verified crypto import correction') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0
      - name: Fix app.ts crypto imports
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.ts')
          text = p.read_text(encoding='utf-8')
          old = "import crypto from 'crypto';"
          new = "import crypto, { randomBytes, createHash, timingSafeEqual } from 'crypto';"
          if old not in text:
              raise SystemExit("Expected app.ts crypto import not found; refusing unsafe edit")
          if "randomBytes" not in text or "createHash" not in text or "timingSafeEqual" not in text:
              raise SystemExit("Expected crypto symbols are not present; refusing unsafe edit")
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.ts .github/workflows/forensic-fix-crypto.yml
          git rm .github/workflows/forensic-fix-crypto.yml
          git diff --cached --check
          git commit -m "fix: apply verified crypto import correction"
          git push origin HEAD:audit/dashboard-sync-fix
