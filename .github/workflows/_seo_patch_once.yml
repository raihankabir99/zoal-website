name: One-time audited SEO source patch

on:
  push:
    branches: [audit/dashboard-sync-fix]
    paths: ['.github/workflows/_seo_patch_once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Apply exact SEO hardening patch
        shell: python
        run: |
          from pathlib import Path

          cms = Path('server/cms.ts')
          s = cms.read_text()
          old = "const PUBLIC_CMS_SETTING_KEYS = new Set(['navigation.menu', 'footer.settings', 'announcement.settings', 'popup.settings']);"
          new = "const PUBLIC_CMS_SETTING_KEYS = new Set(['navigation.menu', 'footer.settings', 'announcement.settings', 'popup.settings', 'seo.global']);"
          assert s.count(old) == 1, 'Unexpected CMS whitelist shape/count'
          cms.write_text(s.replace(old, new, 1))

          seo = Path('src/components/SEO.tsx')
          s = seo.read_text()
          assert s.count("'priceValidUntil': '2030-12-31',") == 1, 'Expected fabricated priceValidUntil not found exactly once'
          assert s.count("'reviewCount': '15',") == 1, 'Expected fabricated reviewCount not found exactly once'
          s = s.replace("        'priceValidUntil': '2030-12-31',\n", '', 1)
          s = s.replace("          'reviewCount': '15',\n", '', 1)
          seo.write_text(s)

      - name: Verify exact patch and build
        run: |
          grep -F "'seo.global'" server/cms.ts
          ! grep -F "'priceValidUntil': '2030-12-31'" src/components/SEO.tsx
          ! grep -F "'reviewCount': '15'" src/components/SEO.tsx
          npm ci
          npm run build

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/cms.ts src/components/SEO.tsx
          git diff --cached --quiet || git commit -m 'fix(seo): remove fabricated structured-data values'
          git push origin audit/dashboard-sync-fix
