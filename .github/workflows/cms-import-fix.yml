name: cms-import-fix
on:
  push:
    branches: [audit/dashboard-sync-fix]
    paths:
      - '.github/workflows/cms-import-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo, branch='audit/dashboard-sync-fix';
            const path='src/components/EnterpriseCmsManager.tsx';
            const get=async p=>(await github.rest.repos.getContent({owner,repo,path:p,ref:branch})).data;
            const f=await get(path); let c=Buffer.from(f.content,'base64').toString('utf8');
            const old="import React, { useState, useEffect, useCallback } from 'react';";
            const neu="import React, { useState, useEffect, useCallback, useRef } from 'react';";
            if(c.includes(old)) c=c.replace(old,neu);
            else if(!c.includes("useRef } from 'react'")) throw new Error('React import pattern not found');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'fix(cms): import useRef for settings guard',content:Buffer.from(c).toString('base64'),sha:f.sha,branch});
            const wf=await get('.github/workflows/cms-import-fix.yml');
            await github.rest.repos.deleteFile({owner,repo,path:'.github/workflows/cms-import-fix.yml',message:'chore: remove one-time cms import fix workflow',sha:wf.sha,branch});