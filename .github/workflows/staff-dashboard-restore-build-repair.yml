name: Staff Dashboard Restore Build Repair

on:
  push:
    branches: [audit/dashboard-sync-fix]
  workflow_dispatch:

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'RESTORE_STAFF_DASHBOARD')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Restore last known StaffDashboard source and repair JSX
        shell: bash
        run: |
          set -euo pipefail
          git checkout 7f0a3f7b8abd95e56f9fd9c17dc63b22919d9160 -- src/components/StaffDashboard.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/StaffDashboard.tsx')
          s = p.read_text(encoding='utf-8')
          names = ('nonReturnableEn','nonReturnableAr','exchangeOptionsEn','exchangeOptionsAr')
          out = []
          for line in s.splitlines(True):
              stripped = line.strip()
              if stripped == "') })}":
                  continue
              replaced = False
              for name in names:
                  if f"{name}: e.target.value.split(" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + f"onChange={{(e) => setLocalReturnsConfig({{ ...returnsConfig, {name}: e.target.value.split('\\n') }})}}\n")
                      replaced = True
                      break
              if not replaced:
                  out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          PY
          if grep -nF "') })}" src/components/StaffDashboard.tsx; then
            echo 'ERROR: stray JSX corruption remains'
            exit 1
          fi
          if grep -nE "split\('[^']*$" src/components/StaffDashboard.tsx; then
            echo 'ERROR: unterminated split literal remains'
            exit 1
          fi

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StaffDashboard.tsx
          git diff --cached --check
          git commit -m 'fix(staff): repair malformed returns JSX RESTORE_STAFF_DASHBOARD'
          git push origin HEAD:audit/dashboard-sync-fix
