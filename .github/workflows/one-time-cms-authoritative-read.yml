name: One-time CMS authoritative read remediation

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, '[cms-authoritative-read]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted CMS remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/EnterpriseCmsManager.tsx')
          s = p.read_text()

          anchor = "  // --- EDITORIAL LOOKBOOK STATE & HANDLERS ---"
          if "fetchAuthoritativeCmsData" not in s:
              insert = r'''  // --- AUTHORITATIVE CMS DATA SYNC ---
  const fetchAuthoritativeCmsData = useCallback(async () => {
    try {
      const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';
      const headers: Record<string, string> = token ? { Authorization: `Bearer ${token}` } : {};
      const response = await fetch('/api/cms', { headers });
      if (!response.ok) throw new Error(`CMS API returned HTTP ${response.status}`);
      const data = await response.json();

      if (Array.isArray(data.sections)) {
        const mappedSections: HomepageSection[] = data.sections.map((section: any, index: number) => ({
          id: String(section.id ?? section.slug ?? `section-${index + 1}`),
          name: String(section.name ?? section.title ?? section.slug ?? `Section ${index + 1}`),
          enabled: section.enabled ?? section.is_active ?? section.active ?? true,
          order: Number(section.order ?? section.display_order ?? index + 1),
          publishAt: section.publish_at ?? section.publishAt ?? '',
          expireAt: section.expire_at ?? section.expireAt ?? ''
        }));
        setHomepageSections(mappedSections.sort((a, b) => a.order - b.order));
      }

      if (Array.isArray(data.banners)) {
        setBanners(data.banners as Banner[]);
      }

      if (Array.isArray(data.pages)) {
        const mappedPages: WebPage[] = data.pages.map((page: any) => ({
          id: String(page.id),
          key: String(page.slug ?? page.key ?? page.id),
          title: String(page.title ?? ''),
          content: String(page.content ?? page.body ?? ''),
          images: Array.isArray(page.images) ? page.images : [],
          videos: Array.isArray(page.videos) ? page.videos : [],
          seoTitle: String(page.seo_title ?? page.seoTitle ?? ''),
          seoDesc: String(page.seo_description ?? page.seoDesc ?? ''),
          status: String(page.status ?? 'draft').toLowerCase() === 'published' ? 'published' : 'draft',
          lastModified: String(page.updated_at ?? page.created_at ?? ''),
          revisionHistory: Array.isArray(page.revision_history) ? page.revision_history : []
        }));
        setWebPages(prev => {
          const legal = prev.filter(page => page.isLegalDoc);
          return [...mappedPages, ...legal];
        });
      }
    } catch (error) {
      console.error('[CMS] Authoritative data sync failed:', error);
    }
  }, []);

  useEffect(() => {
    void fetchAuthoritativeCmsData();
  }, [fetchAuthoritativeCmsData]);

'''
              if anchor not in s:
                  raise SystemExit('CMS insertion anchor not found')
              s = s.replace(anchor, insert + anchor, 1)

          # Remove the client-side RBAC simulator. The authenticated server role remains authoritative.
          old_role = '''          {/* 2. Interactive Role Swapper (RBAC simulation) */}
          <div className="flex items-center gap-1.5 bg-zinc-900 border border-white/5 py-1 px-2.5 rounded-xs">
            <Shield className="w-3.5 h-3.5 text-gold-pure" />
            <select
              value={userRole}
              onChange={(e) => {
                const selected = e.target.value as any;
                setUserRole(selected);
                handleAddCmsActivityLog(`Switched simulator role to ${selected.toUpperCase()}`, 'System Sentry');
                alert(`Simulated Role Swapped to: ${selected.toUpperCase()}`);
              }}
              className="bg-transparent text-[9.5px] uppercase tracking-wider font-mono text-zinc-300 outline-none cursor-pointer"
            >
              <option value="owner" className="bg-black text-white">👑 Owner (Full Rollback)</option>
              <option value="admin" className="bg-black text-white">🛡️ Admin (Full Access)</option>
              <option value="staff" className="bg-black text-white">📋 Staff (Limited Edit)</option>
              <option value="customer" className="bg-black text-white">👤 Customer (Blocked)</option>
            </select>
          </div>'''
          new_role = '''          {/* 2. Server-authoritative role indicator */}
          <div className="flex items-center gap-1.5 bg-zinc-900 border border-white/5 py-1 px-2.5 rounded-xs">
            <Shield className="w-3.5 h-3.5 text-gold-pure" />
            <span className="text-[9.5px] uppercase tracking-wider font-mono text-zinc-300">
              Role: {(currentUser?.role || 'unauthenticated').toString().toUpperCase()}
            </span>
          </div>'''
          if old_role in s:
              s = s.replace(old_role, new_role, 1)

          p.write_text(s)
          PY

          git diff --check
          npm run build
          git add src/components/EnterpriseCmsManager.tsx
          git commit -m "fix(cms): use authoritative CMS reads and remove role simulator [cms-authoritative-read]"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-cms-authoritative-read.yml
          git commit -m "chore(cms): remove one-time remediation workflow [cms-authoritative-read]"
          git push
