name: One-time GTM Production Remediation

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(gtm): apply production GTM remediation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1

      - name: Patch GTM production persistence and CSP
        shell: python
        run: |
          from pathlib import Path
          import re

          admin_path = Path('src/components/AdminDashboard.tsx')
          text = admin_path.read_text(encoding='utf-8')

          marker = "  const [gtmFeedback, setGtmFeedback] = useState<string | null>(null);"
          if "const saveGtmSettings = async (enabled: boolean)" not in text:
              helper = r'''  const saveGtmSettings = async (enabled: boolean) => {
              const { data: { session } } = await supabaseClient.auth.getSession();
              if (!session?.user?.id) throw new Error('No active authenticated admin session.');
              const containerId = gtmContainerId.trim().toUpperCase();
              if (!/^GTM-[A-Z0-9]{5,10}$/.test(containerId)) throw new Error('Invalid GTM Container ID format.');

              const payload = {
                container_id: containerId,
                environment: gtmEnvironment,
                enabled,
                consent_required: gtmConsentMode !== 'Consent Confirmed',
                description: gtmDescription.trim(),
                updated_by: session.user.id
              };

              const { data: existing, error: readError } = await supabaseClient
                .from('zoal_gtm_settings')
                .select('id')
                .maybeSingle();
              if (readError) throw readError;

              const result = existing?.id
                ? await supabaseClient.from('zoal_gtm_settings').update(payload).eq('id', existing.id).select().single()
                : await supabaseClient.from('zoal_gtm_settings').insert(payload).select().single();
              if (result.error) throw result.error;
              return result.data;
            };

            const loadGtmSettings = useCallback(async () => {
              if (!isAdmin) return;
              try {
                const { data, error } = await supabaseClient
                  .from('zoal_gtm_settings')
                  .select('id, container_id, environment, enabled, consent_required, description, updated_by, updated_at')
                  .maybeSingle();
                if (error) throw error;
                if (!data) {
                  setGtmContainerId('');
                  setGtmEnvironment('Production');
                  setGtmStatus('Not Configured');
                  setGtmConsentMode('Not Configured');
                  setGtmDescription('');
                  return;
                }
                setGtmContainerId(data.container_id || '');
                setGtmEnvironment(data.environment || 'Production');
                setGtmStatus(data.enabled ? 'Enabled' : 'Draft');
                setGtmConsentMode(data.consent_required ? 'Consent Required' : 'Consent Confirmed');
                setGtmDescription(data.description || '');
              } catch (error) {
                console.error('[Admin] GTM settings load failed:', error);
                setGtmFeedback('Error: Unable to load GTM configuration from the production database.');
              }
            }, [isAdmin]);

            useEffect(() => {
              loadGtmSettings();
            }, [loadGtmSettings]);
'''
              text = text.replace(marker, marker + "\n\n" + helper.rstrip(), 1)

          old_save = '''onClick={() => {
                              if (!gtmContainerId) {
                                setGtmFeedback('Error: Please enter a valid GTM Container ID first.');
                                return;
                              }
                              setGtmStatus('Draft');
                              const actionMsg = 'Saved GTM UI Draft';
                              addLog(actionMsg);
                              const auditEvent = {
                                action: actionMsg,
                                user: currentUser?.name || 'Admin',
                                timestamp: new Date().toLocaleString(),
                                environment: gtmEnvironment,
                                result: 'Success'
                              };
                              setIntegrationAuditLogs(prev => [auditEvent, ...prev]);
                              setGtmFeedback('Draft configuration stored in this UI session only. Backend persistence is not yet connected.');
                            }}'''
          new_save = '''onClick={async () => {
                              try {
                                await saveGtmSettings(false);
                                setGtmStatus('Draft');
                                const actionMsg = 'Saved GTM production draft configuration';
                                addLog(actionMsg);
                                setGtmFeedback('GTM configuration saved to the production database as a disabled draft.');
                              } catch (error: any) {
                                console.error('[Admin] GTM draft save failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to save GTM configuration.'}`);
                              }
                            }}'''
          if old_save not in text: raise SystemExit('Save Draft handler not found')
          text = text.replace(old_save, new_save, 1)

          old_enable = '''onClick={() => {
                              if (!gtmContainerId) {
                                setGtmFeedback('Error: Please enter a valid GTM Container ID.');
                                return;
                              }
                              setGtmStatus('Enabled');
                              const actionMsg = 'Enabled GTM Tag Container (UI Local)';
                              addLog(actionMsg);
                              const auditEvent = {
                                action: actionMsg,
                                user: currentUser?.name || 'Admin',
                                timestamp: new Date().toLocaleString(),
                                environment: gtmEnvironment,
                                result: 'Success'
                              };
                              setIntegrationAuditLogs(prev => [auditEvent, ...prev]);
                              setGtmFeedback('GTM UI state enabled locally only. No GTM script or tracking has been activated.');
                            }}'''
          new_enable = '''onClick={async () => {
                              try {
                                await saveGtmSettings(true);
                                setGtmStatus('Enabled');
                                const actionMsg = 'Enabled GTM site-side container injection';
                                addLog(actionMsg);
                                setGtmFeedback('GTM is enabled in production. The site will load the saved container after consent.');
                              } catch (error: any) {
                                console.error('[Admin] GTM enable failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to enable GTM.'}`);
                              }
                            }}'''
          if old_enable not in text: raise SystemExit('Enable handler not found')
          text = text.replace(old_enable, new_enable, 1)

          old_disable = '''onClick={() => {
                              setGtmStatus('Disabled');
                              const actionMsg = 'Disabled GTM Tag Container (UI Local)';
                              addLog(actionMsg);
                              const auditEvent = {
                                action: actionMsg,
                                user: currentUser?.name || 'Admin',
                                timestamp: new Date().toLocaleString(),
                                environment: gtmEnvironment,
                                result: 'Success'
                              };
                              setIntegrationAuditLogs(prev => [auditEvent, ...prev]);
                              setGtmFeedback('GTM UI state disabled locally. No external tracking was changed.');
                            }}'''
          new_disable = '''onClick={async () => {
                              try {
                                await saveGtmSettings(false);
                                setGtmStatus('Disabled');
                                const actionMsg = 'Disabled GTM site-side container injection';
                                addLog(actionMsg);
                                setGtmFeedback('GTM site-side injection is disabled in the production database.');
                              } catch (error: any) {
                                console.error('[Admin] GTM disable failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to disable GTM.'}`);
                              }
                            }}'''
          if old_disable not in text: raise SystemExit('Disable handler not found')
          text = text.replace(old_disable, new_disable, 1)

          old_publish = '''onClick={() => {
                              if (!gtmContainerId) {
                                setGtmFeedback('Error: Container ID is required to publish.');
                                return;
                              }
                              setGtmStatus('Enabled');
                              const newVerNum = gtmVersions.length + 1;
                              const newVer = {
                                version: `v${newVerNum}`,
                                status: 'Draft Snapshot',
                                createdBy: currentUser?.name || 'Admin',
                                createdAt: new Date().toLocaleString(),
                                publishedAt: new Date().toLocaleString()
                              };
                              setGtmVersions(prev => [newVer, ...prev]);
                              const actionMsg = `Created GTM Configuration Snapshot v${newVerNum}`;
                              addLog(actionMsg);
                              const auditEvent = {
                                action: actionMsg,
                                user: currentUser?.name || 'Admin',
                                timestamp: new Date().toLocaleString(),
                                environment: gtmEnvironment,
                                result: 'Snapshot Created'
                              };
                              setIntegrationAuditLogs(prev => [auditEvent, ...prev]);
                              setGtmFeedback(`GTM configuration snapshot created locally as UI preview Version v${newVerNum}. It is not published to production GTM.`);
                            }}'''
          new_publish = '''onClick={async () => {
                              try {
                                const data = await saveGtmSettings(true);
                                setGtmStatus('Enabled');
                                const newVerNum = gtmVersions.length + 1;
                                const newVer = {
                                  version: `v${newVerNum}`,
                                  status: 'Site Activated',
                                  containerId: data.container_id,
                                  environment: data.environment,
                                  createdBy: currentUser?.name || 'Admin',
                                  createdAt: new Date().toLocaleString(),
                                  publishedAt: new Date().toLocaleString()
                                };
                                setGtmVersions(prev => [newVer, ...prev]);
                                addLog(`Activated GTM site configuration v${newVerNum}`);
                                setGtmFeedback('GTM site configuration is active. This action does not publish a version inside the Google Tag Manager workspace.');
                              } catch (error: any) {
                                console.error('[Admin] GTM activation failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to activate GTM.'}`);
                              }
                            }}'''
          if old_publish not in text: raise SystemExit('Publish handler not found')
          text = text.replace(old_publish, new_publish, 1)

          text = text.replace("setGtmContainerId('GTM-ZOALHQ');\n                                          setGtmFeedback(`UI Draft Rollback: Restored local workspace form state to snapshot ${v.version}.`);", "if (v.containerId) {\n                                            setGtmContainerId(v.containerId);\n                                            setGtmEnvironment(v.environment || 'Production');\n                                            setGtmStatus('Draft');\n                                            setGtmFeedback(`Restored saved UI snapshot ${v.version}. Save Draft or Enable to persist this configuration.`);\n                                          } else {\n                                            setGtmFeedback(`Snapshot ${v.version} does not contain a restorable container ID.`);\n                                          }")

          text = text.replace('UI Preview Mode • Server persistence & production backend API integrations are not yet connected.', 'Production configuration mode • GTM is database-backed; other third-party integrations remain intentionally empty.')
          text = text.replace('Local UI State • Production GTM script injection & server persistence not connected', 'Production GTM configuration • Container ID is stored in Supabase and site injection is consent-aware')
          text = text.replace('Configure global tagging container properties (UI Draft)', 'Configure the production GTM container used by the public site')
          text = text.replace('Publish Version (Local Snapshot)', 'Activate Site Configuration')
          text = text.replace('Audited version snapshots (UI Drafts)', 'Site activation snapshots (UI history only)')
          text = text.replace('Click &quot;Publish Version (Local Snapshot)&quot; in the GTM Container Setup panel to create a local configuration snapshot.', 'Use &quot;Activate Site Configuration&quot; to persist and activate the current GTM container on the public site.')

          admin_path.write_text(text, encoding='utf-8')

          security_path = Path('server/security.ts')
          sec = security_path.read_text(encoding='utf-8')
          sec = sec.replace("script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://*.supabase.in https://*.googleapis.com", "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://*.supabase.in https://*.googleapis.com https://www.googletagmanager.com")
          sec = sec.replace("connect-src 'self' ws: wss: https://*.supabase.co https://*.supabase.in https://api.studio https://*.google.com https://*.run.app", "connect-src 'self' ws: wss: https://*.supabase.co https://*.supabase.in https://api.studio https://*.google.com https://*.run.app https://www.googletagmanager.com")
          sec = sec.replace('frame-src \'self\' https://*.supabase.co', "frame-src 'self' https://*.supabase.co https://www.googletagmanager.com")
          security_path.write_text(sec, encoding='utf-8')

          mig_path = Path('supabase/migrations/99999999999999_create_zoal_gtm_settings.sql')
          mig = '''-- ZOAL: minimal production Google Tag Manager configuration.
-- Only non-secret GTM container configuration is stored here.
create table if not exists public.zoal_gtm_settings (
  id uuid primary key default gen_random_uuid(),
  container_id text not null check (container_id ~ '^GTM-[A-Z0-9]{5,10}$'),
  environment text not null default 'Production' check (environment in ('Production','Staging','Development')),
  enabled boolean not null default false,
  consent_required boolean not null default true,
  description text not null default '',
  updated_by text,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create unique index if not exists zoal_gtm_settings_singleton_idx on public.zoal_gtm_settings ((true));

alter table public.zoal_gtm_settings enable row level security;

grant select on public.zoal_gtm_settings to anon, authenticated;
grant insert, update, delete on public.zoal_gtm_settings to authenticated;

drop policy if exists zoal_gtm_public_read_enabled on public.zoal_gtm_settings;
create policy zoal_gtm_public_read_enabled
on public.zoal_gtm_settings
for select
to anon, authenticated
using (enabled = true);

drop policy if exists zoal_gtm_admin_write on public.zoal_gtm_settings;
create policy zoal_gtm_admin_write
on public.zoal_gtm_settings
for all
to authenticated
using (exists (select 1 from public.zoal_users u where u.id::text = auth.uid()::text and u.role in ('owner','admin')))
with check (exists (select 1 from public.zoal_users u where u.id::text = auth.uid()::text and u.role in ('owner','admin')));

create or replace function public.zoal_gtm_settings_updated_at()
returns trigger
language plpgsql
as $$
begin
  new.updated_at = now();
  return new;
end;
$$;

drop trigger if exists zoal_gtm_settings_updated_at on public.zoal_gtm_settings;
create trigger zoal_gtm_settings_updated_at
before update on public.zoal_gtm_settings
for each row execute function public.zoal_gtm_settings_updated_at();
'''
          mig_path.write_text(mig, encoding='utf-8')

          if not text or not sec:
              raise SystemExit('Unexpected empty file after remediation')

      - name: Commit remediation and remove one-time runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtm-production-remediation.yml
          git add src/components/AdminDashboard.tsx server/security.ts supabase/migrations/99999999999999_create_zoal_gtm_settings.sql .github/workflows/gtm-production-remediation.yml
          git commit -m "chore(gtm): apply production GTM remediation"
          git push origin audit/dashboard-sync-fix
