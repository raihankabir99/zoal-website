name: One-time GTM Production Remediation

on:
  push:
    branches:
      - audit/dashboard-sync-fix
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1

      - name: Apply minimal GTM production patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          if 'const saveGtmSettings = async (enabled: boolean)' not in s:
              marker = "  const [gtmFeedback, setGtmFeedback] = useState<string | null>(null);"
              assert marker in s, 'GTM state marker not found'
              helper = '''\n\n  const saveGtmSettings = async (enabled: boolean) => {\n    const { data: { session } } = await supabaseClient.auth.getSession();\n    if (!session?.user?.id) throw new Error('No active authenticated admin session.');\n    const containerId = gtmContainerId.trim().toUpperCase();\n    if (!/^GTM-[A-Z0-9]{5,10}$/.test(containerId)) throw new Error('Invalid GTM Container ID format.');\n    const payload = { container_id: containerId, environment: gtmEnvironment, enabled, consent_required: gtmConsentMode !== 'Consent Confirmed', description: gtmDescription.trim(), updated_by: session.user.id };\n    const { data: existing, error: readError } = await supabaseClient.from('zoal_gtm_settings').select('id').maybeSingle();\n    if (readError) throw readError;\n    const result = existing?.id\n      ? await supabaseClient.from('zoal_gtm_settings').update(payload).eq('id', existing.id).select().single()\n      : await supabaseClient.from('zoal_gtm_settings').insert(payload).select().single();\n    if (result.error) throw result.error;\n    return result.data;\n  };\n\n  const loadGtmSettings = useCallback(async () => {\n    if (!isAdmin) return;\n    try {\n      const { data, error } = await supabaseClient.from('zoal_gtm_settings').select('id, container_id, environment, enabled, consent_required, description, updated_by, updated_at').maybeSingle();\n      if (error) throw error;\n      if (!data) { setGtmContainerId(''); setGtmEnvironment('Production'); setGtmStatus('Not Configured'); setGtmConsentMode('Not Configured'); setGtmDescription(''); return; }\n      setGtmContainerId(data.container_id || '');\n      setGtmEnvironment(data.environment || 'Production');\n      setGtmStatus(data.enabled ? 'Enabled' : 'Draft');\n      setGtmConsentMode(data.consent_required ? 'Consent Required' : 'Consent Confirmed');\n      setGtmDescription(data.description || '');\n    } catch (error) {\n      console.error('[Admin] GTM settings load failed:', error);\n      setGtmFeedback('Error: Unable to load GTM configuration from the production database.');\n    }\n  }, [isAdmin]);\n\n  useEffect(() => { loadGtmSettings(); }, [loadGtmSettings]);'''
              s = s.replace(marker, marker + helper, 1)

          def make_async_before(anchor, injected):
              idx = s.find(anchor)
              assert idx >= 0, f'Anchor not found: {anchor}'
              opener = 'onClick={() => {'
              start = s.rfind(opener, 0, idx)
              assert start >= 0, f'Handler opener not found before: {anchor}'
              replacement = "onClick={async () => {\n" + injected + "\n                              return;\n                            } catch (error: any) {\n                              console.error('[Admin] GTM action failed:', error);\n                              setGtmFeedback(`Error: ${error?.message || 'Unable to update GTM configuration.'}`);\n                              return;\n                            }\n                            "
              return s[:start] + replacement + s[start + len(opener):]

          s = make_async_before("const actionMsg = 'Saved GTM UI Draft';", "                              try {\n                                await saveGtmSettings(false);\n                                setGtmStatus('Draft');\n                                setGtmFeedback('GTM configuration saved to the production database as a disabled draft.');")
          s = make_async_before("const actionMsg = 'Enabled GTM Tag Container (UI Local)';", "                              try {\n                                await saveGtmSettings(true);\n                                setGtmStatus('Enabled');\n                                setGtmFeedback('GTM is enabled in production. The site will load the saved container after consent.');")
          s = make_async_before("const actionMsg = 'Disabled GTM Tag Container (UI Local)';", "                              try {\n                                await saveGtmSettings(false);\n                                setGtmStatus('Disabled');\n                                setGtmFeedback('GTM site-side injection is disabled in the production database.');")
          s = make_async_before("const newVerNum = gtmVersions.length + 1;", "                              try {\n                                const activated = await saveGtmSettings(true);\n                                setGtmStatus('Enabled');\n                                setGtmFeedback('GTM site configuration is active. This action does not publish a version inside the Google Tag Manager workspace.');")
          s = s.replace("setGtmContainerId('GTM-ZOALHQ');", "setGtmContainerId(v.containerId || '');")
          s = s.replace('Publish Version (Local Snapshot)', 'Activate Site Configuration')
          s = s.replace('UI Preview Mode • Server persistence & production backend API integrations are not yet connected.', 'Production configuration mode • GTM is database-backed; other third-party integrations remain intentionally empty.')
          s = s.replace('Local UI State • Production GTM script injection & server persistence not connected', 'Production GTM configuration • Container ID is stored in Supabase and site injection is consent-aware')
          p.write_text(s, encoding='utf-8')

          p = Path('server/security.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("https://*.googleapis.com", "https://*.googleapis.com https://www.googletagmanager.com", 1)
          s = s.replace("https://*.run.app", "https://*.run.app https://www.googletagmanager.com", 1)
          p.write_text(s, encoding='utf-8')

          assert 'const saveGtmSettings = async (enabled: boolean)' in Path('src/components/AdminDashboard.tsx').read_text(encoding='utf-8')
          assert 'https://www.googletagmanager.com' in Path('server/security.ts').read_text(encoding='utf-8')

      - name: Commit remediation and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtm-production-remediation.yml
          git add src/components/AdminDashboard.tsx server/security.ts .github/workflows/gtm-production-remediation.yml
          git commit -m "chore(gtm): apply production GTM remediation"
          git push origin audit/dashboard-sync-fix
