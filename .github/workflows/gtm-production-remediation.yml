name: One-time GTM Production Remediation

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(gtm): apply production GTM remediation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1

      - name: Apply minimal GTM production patch
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          if 'const saveGtmSettings = async (enabled: boolean)' not in s:
              marker = "  const [gtmFeedback, setGtmFeedback] = useState<string | null>(null);"
              assert marker in s, 'GTM state marker not found'
              helper = '''\n\n  const saveGtmSettings = async (enabled: boolean) => {\n    const { data: { session } } = await supabaseClient.auth.getSession();\n    if (!session?.user?.id) throw new Error('No active authenticated admin session.');\n    const containerId = gtmContainerId.trim().toUpperCase();\n    if (!/^GTM-[A-Z0-9]{5,10}$/.test(containerId)) throw new Error('Invalid GTM Container ID format.');\n    const payload = {\n      container_id: containerId,\n      environment: gtmEnvironment,\n      enabled,\n      consent_required: gtmConsentMode !== 'Consent Confirmed',\n      description: gtmDescription.trim(),\n      updated_by: session.user.id\n    };\n    const { data: existing, error: readError } = await supabaseClient.from('zoal_gtm_settings').select('id').maybeSingle();\n    if (readError) throw readError;\n    const result = existing?.id\n      ? await supabaseClient.from('zoal_gtm_settings').update(payload).eq('id', existing.id).select().single()\n      : await supabaseClient.from('zoal_gtm_settings').insert(payload).select().single();\n    if (result.error) throw result.error;\n    return result.data;\n  };\n\n  const loadGtmSettings = useCallback(async () => {\n    if (!isAdmin) return;\n    try {\n      const { data, error } = await supabaseClient.from('zoal_gtm_settings').select('id, container_id, environment, enabled, consent_required, description, updated_by, updated_at').maybeSingle();\n      if (error) throw error;\n      if (!data) {\n        setGtmContainerId(''); setGtmEnvironment('Production'); setGtmStatus('Not Configured'); setGtmConsentMode('Not Configured'); setGtmDescription(''); return;\n      }\n      setGtmContainerId(data.container_id || '');\n      setGtmEnvironment(data.environment || 'Production');\n      setGtmStatus(data.enabled ? 'Enabled' : 'Draft');\n      setGtmConsentMode(data.consent_required ? 'Consent Required' : 'Consent Confirmed');\n      setGtmDescription(data.description || '');\n    } catch (error) {\n      console.error('[Admin] GTM settings load failed:', error);\n      setGtmFeedback('Error: Unable to load GTM configuration from the production database.');\n    }\n  }, [isAdmin]);\n\n  useEffect(() => { loadGtmSettings(); }, [loadGtmSettings]);'''
              s = s.replace(marker, marker + helper, 1)

          s, n = re.subn(r"onClick=\{\(\) => \{\s*if \(!gtmContainerId\) \{\s*setGtmFeedback\('Error: Please enter a valid GTM Container ID first\\.'\);.*?setGtmFeedback\('Draft configuration stored in this UI session only\. Backend persistence is not yet connected\\.'\);\s*\}\}", "onClick={async () => { try { await saveGtmSettings(false); setGtmStatus('Draft'); addLog('Saved GTM production draft configuration'); setGtmFeedback('GTM configuration saved to the production database as a disabled draft.'); } catch (error: any) { console.error('[Admin] GTM draft save failed:', error); setGtmFeedback(`Error: ${error?.message || 'Unable to save GTM configuration.'}`); } }}", s, count=1, flags=re.S)
          assert n == 1, f'Save Draft handler replacement count={n}'

          s, n = re.subn(r"onClick=\{\(\) => \{\s*if \(!gtmContainerId\) \{\s*setGtmFeedback\('Error: Please enter a valid GTM Container ID\\.'\);.*?setGtmFeedback\('GTM UI state enabled locally only\. No GTM script or tracking has been activated\\.'\);\s*\}\}", "onClick={async () => { try { await saveGtmSettings(true); setGtmStatus('Enabled'); addLog('Enabled GTM site-side container injection'); setGtmFeedback('GTM is enabled in production. The site will load the saved container after consent.'); } catch (error: any) { console.error('[Admin] GTM enable failed:', error); setGtmFeedback(`Error: ${error?.message || 'Unable to enable GTM.'}`); } }}", s, count=1, flags=re.S)
          assert n == 1, f'Enable handler replacement count={n}'

          s, n = re.subn(r"onClick=\{\(\) => \{\s*setGtmStatus\('Disabled'\);.*?setGtmFeedback\('GTM UI state disabled locally\. No external tracking was changed\\.'\);\s*\}\}", "onClick={async () => { try { await saveGtmSettings(false); setGtmStatus('Disabled'); addLog('Disabled GTM site-side container injection'); setGtmFeedback('GTM site-side injection is disabled in the production database.'); } catch (error: any) { console.error('[Admin] GTM disable failed:', error); setGtmFeedback(`Error: ${error?.message || 'Unable to disable GTM.'}`); } }}", s, count=1, flags=re.S)
          assert n == 1, f'Disable handler replacement count={n}'

          s, n = re.subn(r"onClick=\{\(\) => \{\s*if \(!gtmContainerId\) \{\s*setGtmFeedback\('Error: Container ID is required to publish\\.'\);.*?setGtmFeedback\(`GTM configuration snapshot created locally as UI preview Version v\$\{newVerNum\}\\. It is not published to production GTM\\.`\);\s*\}\}", "onClick={async () => { try { const data = await saveGtmSettings(true); setGtmStatus('Enabled'); const newVerNum = gtmVersions.length + 1; setGtmVersions(prev => [{ version: `v${newVerNum}`, status: 'Site Activated', containerId: data.container_id, environment: data.environment, createdBy: currentUser?.name || 'Admin', createdAt: new Date().toLocaleString(), publishedAt: new Date().toLocaleString() }, ...prev]); addLog(`Activated GTM site configuration v${newVerNum}`); setGtmFeedback('GTM site configuration is active. This action does not publish a version inside the Google Tag Manager workspace.'); } catch (error: any) { console.error('[Admin] GTM activation failed:', error); setGtmFeedback(`Error: ${error?.message || 'Unable to activate GTM.'}`); } }}", s, count=1, flags=re.S)
          assert n == 1, f'Publish handler replacement count={n}'

          s = s.replace("setGtmContainerId('GTM-ZOALHQ');", "setGtmContainerId(v.containerId || '');")
          s = s.replace('Publish Version (Local Snapshot)', 'Activate Site Configuration')
          s = s.replace('UI Preview Mode • Server persistence & production backend API integrations are not yet connected.', 'Production configuration mode • GTM is database-backed; other third-party integrations remain intentionally empty.')
          s = s.replace('Local UI State • Production GTM script injection & server persistence not connected', 'Production GTM configuration • Container ID is stored in Supabase and site injection is consent-aware')
          p.write_text(s, encoding='utf-8')

          p = Path('server/security.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("https://*.googleapis.com", "https://*.googleapis.com https://www.googletagmanager.com", 1)
          s = s.replace("https://*.run.app", "https://*.run.app https://www.googletagmanager.com", 1)
          p.write_text(s, encoding='utf-8')

          assert 'const saveGtmSettings = async (enabled: boolean)' in Path('src/components/AdminDashboard.tsx').read_text(encoding='utf-8')
          assert 'https://www.googletagmanager.com' in Path('server/security.ts').read_text(encoding='utf-8')

      - name: Commit remediation and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtm-production-remediation.yml
          git add src/components/AdminDashboard.tsx server/security.ts .github/workflows/gtm-production-remediation.yml
          git commit -m "chore(gtm): apply production GTM remediation"
          git push origin audit/dashboard-sync-fix

# retrigger verification runner
