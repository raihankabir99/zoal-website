name: One-Time Public Product Authority Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix
    paths:
      - '.github/workflows/one-time-public-product-authority-fix.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch public product authority
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          registry = Path('src/imageRegistry.tsx')
          text = registry.read_text(encoding='utf-8')

          start = text.index('/**\n * Reactive hook merging static and custom products continuously\n */\nexport function useGlobalProducts(): Product[] {')
          end = text.index('\nexport function useGlobalImages', start)

          replacement = '''/**
           * Public/customer-facing product catalog authority.
           *
           * The storefront must never render products seeded from localStorage.
           * Only a successful server/API product sync may populate this state.
           */
          export function useGlobalProducts(): Product[] {
            const [customProducts, setCustomProducts] = useState<Product[]>([]);

            useEffect(() => {
              let active = true;

              import('./lib/productSync')
                .then(mod => mod.triggerProductFetch())
                .then((products) => {
                  if (!active) return;
                  setCustomProducts(Array.isArray(products) ? products.filter((p: Product) => p && p.id) : []);
                })
                .catch(() => {
                  if (active) setCustomProducts([]);
                });

              return () => {
                active = false;
              };
            }, []);

            return customProducts.filter(p => p && p.id);
          }
'''

          text = text[:start] + replacement + text[end:]
          text = text.replace("import React, { useState, useEffect, useLayoutEffect, useRef } from 'react';", "import React, { useState, useEffect, useLayoutEffect, useRef } from 'react';")
          registry.write_text(text, encoding='utf-8')

          sync = Path('src/lib/productSync.ts')
          text = sync.read_text(encoding='utf-8')

          # Public catalog failures must not resurrect stale product cache.
          text, count = re.subn(r"(?m)^\s*return localStorage\.getItem\(CACHE_KEYS\.PRODUCTS\).*;$", "  return [];", text, count=1)
          sync.write_text(text, encoding='utf-8')

          print('Patched imageRegistry.tsx and productSync.ts')
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          grep -n "export function useGlobalProducts" src/imageRegistry.tsx
          if grep -n "localStorage.getItem('zoal_custom_products')" src/imageRegistry.tsx; then
            echo 'ERROR: public catalog still seeds from zoal_custom_products'
            exit 1
          fi
          if grep -n "return localStorage.getItem(CACHE_KEYS.PRODUCTS)" src/lib/productSync.ts; then
            echo 'ERROR: stale product cache fallback still present'
            exit 1
          fi
          git diff --check

      - name: Commit patch and remove one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/one-time-public-product-authority-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/imageRegistry.tsx src/lib/productSync.ts .github/workflows/one-time-public-product-authority-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(store): enforce server-authoritative public product catalog"
          git push origin HEAD:audit/dashboard-sync-fix

# One-time remediation trigger refresh.
