name: cms-settings-hardening
on:
  push:
    branches: [audit/dashboard-sync-fix]
    paths:
      - '.github/workflows/cms-settings-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'audit/dashboard-sync-fix';
            const get = async (path) => (await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;
            const update = async (path, content, sha, message) => github.rest.repos.createOrUpdateFileContents({owner,repo,path,message,content:Buffer.from(content).toString('base64'),sha,branch});
            const serverPath = 'server/cms.ts';
            const server = await get(serverPath);
            let s = Buffer.from(server.content, 'base64').toString('utf8');
            if (!s.includes('PUBLIC_CMS_SETTING_KEYS')) s = s.replace("import { logAuditEvent } from './audit';\n", "import { logAuditEvent } from './audit';\n\nconst PUBLIC_CMS_SETTING_KEYS = new Set(['navigation.menu', 'footer.settings', 'announcement.settings', 'popup.settings']);\n");
            s = s.replace("const { data, error } = await supabase.from('zoal_cms_settings').select('*').eq('status', 'published');", "const { data, error } = await supabase.from('zoal_cms_settings').select('id,setting_key,setting_value,status,created_at,updated_at').eq('status', 'published').in('setting_key', Array.from(PUBLIC_CMS_SETTING_KEYS));");
            const keyGuard = "if (!/^[a-z0-9_.-]{2,120}$/i.test(String(key))) return res.status(400).json({ error: 'Invalid CMS setting key.' });";
            if (!s.includes('Unknown CMS setting key.')) s = s.replace(keyGuard, keyGuard + "\n  if (!PUBLIC_CMS_SETTING_KEYS.has(String(key))) return res.status(404).json({ error: 'Unknown CMS setting key.' });");
            const valueGuard = "if (value === undefined) return res.status(400).json({ error: 'CMS setting value is required.' });";
            if (!s.includes('CMS setting value is too large.')) s = s.replace(valueGuard, valueGuard + "\n  if (JSON.stringify(value).length > 250000) return res.status(413).json({ error: 'CMS setting value is too large.' });");
            if (s === Buffer.from(server.content, 'base64').toString('utf8')) throw new Error('server/cms.ts patch made no changes');
            await update(serverPath, s, server.sha, 'fix(cms): harden public settings registry');
            const componentPath = 'src/components/EnterpriseCmsManager.tsx';
            const component = await get(componentPath);
            let c = Buffer.from(component.content, 'base64').toString('utf8');
            if (!c.includes('cmsSettingsBaselineRef')) c = c.replace("const [cmsSettingsLoaded, setCmsSettingsLoaded] = useState(false);", "const [cmsSettingsLoaded, setCmsSettingsLoaded] = useState(false);\n  const cmsSettingsBaselineRef = useRef<string>('');\n  const cmsSettingsDirtyRef = useRef(false);");
            if (!c.includes('cmsSettingsBaselineRef.current = JSON.stringify')) c = c.replace("if (popupValue && typeof popupValue === 'object') setPopup(popupValue);", "if (popupValue && typeof popupValue === 'object') setPopup(popupValue);\n      cmsSettingsBaselineRef.current = JSON.stringify({ menu, footer, announcement: announcementValue, popup: popupValue });");
            c = c.replace("if (!cmsSettingsLoaded) return;\n  const timer = window.setTimeout(() => {", "if (!cmsSettingsLoaded || !cmsSettingsDirtyRef.current) return;\n  const timer = window.setTimeout(() => {");
            if (!c.includes('cmsSettingsDirtyRef.current = false;')) c = c.replace("void saveCmsSetting('popup.settings', popup);\n  }, 700);", "void saveCmsSetting('popup.settings', popup);\n    cmsSettingsDirtyRef.current = false;\n    cmsSettingsBaselineRef.current = JSON.stringify({ menu: menuItems, footer: footerSettings, announcement, popup });\n  }, 700);");
            if (!c.includes('cmsSettingsDirtyRef.current = true')) {
              const depLine = "}, [cmsSettingsLoaded, menuItems, footerSettings, announcement, popup, saveCmsSetting]);";
              if (c.includes(depLine)) c = c.replace(depLine, depLine + "\n\n  useEffect(() => {\n    if (!cmsSettingsLoaded) return;\n    const current = JSON.stringify({ menu: menuItems, footer: footerSettings, announcement, popup });\n    if (cmsSettingsBaselineRef.current && current !== cmsSettingsBaselineRef.current) cmsSettingsDirtyRef.current = true;\n  }, [cmsSettingsLoaded, menuItems, footerSettings, announcement, popup]);");
            }
            await update(componentPath, c, component.sha, 'fix(cms): avoid bootstrap writeback of global settings');
            const wf = await get('.github/workflows/cms-settings-hardening.yml');
            await github.rest.repos.deleteFile({owner,repo,path:'.github/workflows/cms-settings-hardening.yml',message:'chore: remove one-time cms settings hardening workflow',sha:wf.sha,branch});