name: One-time Store Collection Image Authority

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch Store and Collection image sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/components/Store.tsx')
          text = store.read_text()

          text = text.replace("import { Product, BusinessCategory } from '../types';", "import { Product } from '../types';")

          start = text.index("  const categories = useMemo(() => {")
          end = text.index("  const brandsList = useMemo(() => {", start)
          new_categories = '''  const categories = useMemo(() => {
            // CMS/API authoritative. Never resurrect legacy localStorage/static imagery.
            if (serverCategories === null) {
              console.warn('[Audit] Store category API unavailable; showing empty authoritative image state.');
              return [{ id: 'all', name: t('store.category.all'), featuredImage: '' }];
            }

            const published = serverCategories.filter((c: any) => c.status === 'Published' || c.status === undefined);
            const list = [
              { id: 'all', name: t('store.category.all'), featuredImage: '' },
              ...published.map((c: any) => {
                const catId = c.slug || c.id;
                const key = `store.category.${catId}`;
                const hasKey = i18n.exists(key);
                const localizedName = hasKey
                  ? t(key)
                  : (isAr ? (c.nameAr || c.name_ar || c.name) : (c.nameEn || c.name));
                const featuredImage = [c.featuredImage, c.image, c.imageUrl]
                  .find((value: any) => isImgValid(value) && !value.includes('/assets/categories/')) || '';
                return {
                  id: catId,
                  slug: c.slug,
                  name: localizedName,
                  featuredImage,
                  bannerImage: c.bannerImage || '',
                  image: c.image || '',
                  imageUrl: c.imageUrl || ''
                };
              })
            ];

            const seen = new Set();
            return list.filter((item: any) => {
              if (!item.id || seen.has(item.id)) return false;
              seen.add(item.id);
              return true;
            });
          }, [serverCategories, t, isAr, i18n]);

'''
          text = text[:start] + new_categories + text[end:]

          start = text.index("  const brandsList = useMemo(() => {")
          end = text.index("  // Sync category filter if received as a prop", start)
          new_brands = '''  const brandsList = useMemo(() => {
            if (serverBrands === null) {
              console.warn('[Audit] Store brand API unavailable; showing empty authoritative brand state.');
              return [{ id: 'all', name: t('store.all_brands', { defaultValue: 'All Brands' }) }];
            }

            const published = serverBrands.filter((b: any) => b.status === 'Published' || b.status === undefined || b.featuredToggle);
            const list = [
              { id: 'all', name: t('store.all_brands', { defaultValue: 'All Brands' }) },
              ...published.map((b: any) => ({ id: b.name || b.id, name: b.name || b.nameEn || b.nameAr || String(b.id) }))
            ];
            const seen = new Set();
            return list.filter((item: any) => {
              if (!item.id || seen.has(item.id)) return false;
              seen.add(item.id);
              return true;
            });
          }, [serverBrands, t]);

'''
          text = text[:start] + new_brands + text[end:]

          preset_start = text.find("  const PRESET_ASSETS = [")
          if preset_start != -1:
              preset_end = text.find("\n\n  // Sync category filter if received as a prop", preset_start)
              if preset_end != -1:
                  text = text[:preset_start] + text[preset_end+2:]

          store.write_text(text)

          portfolio = Path('src/components/Portfolio.tsx')
          p = portfolio.read_text()
          p = p.replace("import { SafeImage, useGlobalProducts, resolveProductImage, normalizeCategory } from '../imageRegistry';", "import { useGlobalProducts, resolveProductImage, normalizeCategory } from '../imageRegistry';")
          if "import { categoryApi } from '../lib/categoryApi';" not in p:
              p = p.replace("import { Product } from '../types';", "import { Product } from '../types';\nimport { categoryApi } from '../lib/categoryApi';")

          p = p.replace("  const [cmsBlocks, setCmsBlocks] = useState<any[]>([]);\n  const firstSectionRef", "  const [cmsBlocks, setCmsBlocks] = useState<any[]>([]);\n  const [cmsCategories, setCmsCategories] = useState<any[]>([]);\n  const firstSectionRef", 1)

          effect_start = p.find("  useEffect(() => {\n    fetch('/api/homepage-editorial')")
          if effect_start == -1:
              raise SystemExit('Portfolio editorial effect anchor not found')
          effect_end = p.find("\n  }, []);", effect_start)
          if effect_end == -1:
              raise SystemExit('Portfolio editorial effect end not found')
          effect_end += len("\n  }, []);")
          new_effect = '''  useEffect(() => {
    let active = true;

    fetch('/api/homepage-editorial', { cache: 'no-store' })
      .then(res => {
        if (res.ok) return res.json();
        throw new Error(`Editorial request failed (${res.status})`);
      })
      .then(data => {
        if (active && Array.isArray(data)) setCmsBlocks(data.filter(b => b && b.status === 'published'));
      })
      .catch(err => console.warn('[Collection] Editorial CMS unavailable; static image fallback disabled.', err));

    categoryApi.list()
      .then(rows => {
        if (active) setCmsCategories(Array.isArray(rows) ? rows : []);
      })
      .catch(err => console.warn('[Collection] Category CMS unavailable; static image fallback disabled.', err));

    return () => {
      active = false;
    };
  }, []);'''
          p = p[:effect_start] + new_effect + p[effect_end:]

          # Strip local/static default image maps and hardcoded collection image URLs.
          import re
          p = re.sub(r"\n\s*const defaultImages: Record<string, string> = \{.*?\n\s*\};\n", "\n", p, flags=re.S)
          p = re.sub(r"\n\s*defaultImg:\s*['\"][^'\"]+['\"],?", "", p)
          p = p.replace("src=\"https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=80&w=1600\"", "src={cmsBlocks.find((b: any) => b.desktop_image || b.mobile_image)?.desktop_image || cmsBlocks.find((b: any) => b.desktop_image || b.mobile_image)?.mobile_image || cmsCategories.find((c: any) => c.bannerImage || c.featuredImage || c.image || c.imageUrl)?.bannerImage || cmsCategories.find((c: any) => c.bannerImage || c.featuredImage || c.image || c.imageUrl)?.featuredImage || cmsCategories.find((c: any) => c.bannerImage || c.featuredImage || c.image || c.imageUrl)?.image || cmsCategories.find((c: any) => c.bannerImage || c.featuredImage || c.image || c.imageUrl)?.imageUrl || ''}")

          p = p.replace("    const block = cmsBlocks.find(b => normalizeCategory(b.category) === target);", "    const block = cmsBlocks.find(b => normalizeCategory(b.category) === target);\n    const categoryCms = cmsCategories.find((c: any) => normalizeCategory(c.slug || c.name) === target);")
          p = p.replace("      image: defaultImages[target] || '/images/collections/collection.png'", "      image: categoryCms?.bannerImage || categoryCms?.featuredImage || categoryCms?.image || categoryCms?.imageUrl || ''")
          p = p.replace("      image: block.desktop_image || block.mobile_image", "      image: block.desktop_image || block.mobile_image || categoryCms?.bannerImage || categoryCms?.featuredImage || categoryCms?.image || categoryCms?.imageUrl || ''")

          portfolio.write_text(p)
          print('Patched Store.tsx and Portfolio.tsx')
          PY

      - name: Build validation
        run: |
          test -f package.json
          npm ci --ignore-scripts
          npm run build

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Store.tsx src/components/Portfolio.tsx .github/workflows/one-time-store-collection-image-authority.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(store): remove legacy image fallbacks from storefront collections'
          git rm .github/workflows/one-time-store-collection-image-authority.yml
          git commit -m 'chore(audit): remove one-time storefront remediation workflow'
          git push origin HEAD:audit/dashboard-sync-fix
