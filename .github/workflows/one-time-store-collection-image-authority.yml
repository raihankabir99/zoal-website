name: One-time Store Collection Image Authority

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/audit/dashboard-sync-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 2

      - name: Patch strict CMS image authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------- Store ----------------
          store = Path('src/components/Store.tsx')
          s = store.read_text()
          s = s.replace("import { Product, BusinessCategory } from '../types';", "import { Product } from '../types';")
          if "disableFallback" not in s:
              s = s.replace("                      <SafeImage\n", "                      <SafeImage\n                        disableFallback\n", 1)
              s = s.replace("                    <SafeImage\n", "                    <SafeImage\n                      disableFallback\n", 1)
          store.write_text(s)

          # ---------------- Image registry ----------------
          reg = Path('src/imageRegistry.tsx')
          r = reg.read_text()
          r = r.replace("  product?: Partial<Product> | null;\n}", "  product?: Partial<Product> | null;\n  disableFallback?: boolean;\n}")
          r = r.replace("  priority,\n  isHero,\n  product,\n  ...props", "  priority,\n  isHero,\n  product,\n  disableFallback = false,\n  ...props")

          old_sig = "export function resolveProductImage(\n  product?: Partial<Product> | null,\n  categoryOverride?: BusinessCategory\n): string {"
          new_sig = "export function resolveProductImage(\n  product?: Partial<Product> | null,\n  categoryOverride?: BusinessCategory,\n  allowFallback: boolean = true\n): string {"
          if old_sig in r:
              r = r.replace(old_sig, new_sig, 1)

          old_no_product = """  if (!product) {\n    const category = categoryOverride ? normalizeCategory(categoryOverride) : 'coffee';\n    return getCategoryFallback(category);\n  }"""
          new_no_product = """  if (!product) {\n    const category = categoryOverride ? normalizeCategory(categoryOverride) : 'coffee';\n    return allowFallback ? getCategoryFallback(category) : ABSOLUTE_PLACEHOLDER;\n  }"""
          r = r.replace(old_no_product, new_no_product, 1)

          strict_block = """  if (!product) {\n    const category = categoryOverride ? normalizeCategory(categoryOverride) : 'coffee';\n    return allowFallback ? getCategoryFallback(category) : ABSOLUTE_PLACEHOLDER;\n  }\n\n  const category = categoryOverride ? normalizeCategory(categoryOverride) : normalizeCategory(product.category);"""
          strict_replacement = """  if (!product) {\n    const category = categoryOverride ? normalizeCategory(categoryOverride) : 'coffee';\n    return allowFallback ? getCategoryFallback(category) : ABSOLUTE_PLACEHOLDER;\n  }\n\n  if (!allowFallback) {\n    const strictCandidates = [\n      ...(Array.isArray(product.images) ? product.images : []),\n      ...(Array.isArray(product.image_urls) ? product.image_urls : []),\n      product.image,\n      product.image_url\n    ].map(cleanUrlString).filter(Boolean);\n    const strictImage = strictCandidates.find((url) =>\n      !url.startsWith('/images/collections/') &&\n      !url.startsWith('/images/about/') &&\n      !url.includes('images.unsplash.com') &&\n      (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('/'))\n    );\n    return strictImage || ABSOLUTE_PLACEHOLDER;\n  }\n\n  const category = categoryOverride ? normalizeCategory(categoryOverride) : normalizeCategory(product.category);"""
          r = r.replace(strict_block, strict_replacement, 1)

          r = r.replace("    return getCategoryFallback(category);\n}\n\ninterface SafeImageProps", "    return allowFallback ? getCategoryFallback(category) : ABSOLUTE_PLACEHOLDER;\n}\n\ninterface SafeImageProps", 1)

          # SafeImage: strict mode must never turn missing/broken Store/Collection CMS data into a static category image.
          old_compute = """  const computeTarget = () => {\n    if (product) {\n      return resolveProductImage(product, category);\n    }\n    if (isHero) {\n      return src && src.trim() !== '' ? src : '/local/images/hero-placeholder.webp';\n    }\n    if (isValidUploadedImageUrl(src)) {\n      return src!.trim();\n    }\n    return getFallbackImage(src, category);\n  };"""
          new_compute = """  const computeTarget = () => {\n    if (product) {\n      return resolveProductImage(product, category, !disableFallback);\n    }\n    if (disableFallback) {\n      const candidate = cleanUrlString(src);\n      if (candidate && !candidate.startsWith('/images/collections/') && !candidate.startsWith('/images/about/') && !candidate.includes('images.unsplash.com') && isValidCustomUrl(candidate)) {\n        return candidate;\n      }\n      return ABSOLUTE_PLACEHOLDER;\n    }\n    if (isHero) {\n      return src && src.trim() !== '' ? src : '/local/images/hero-placeholder.webp';\n    }\n    if (isValidUploadedImageUrl(src)) {\n      return src!.trim();\n    }\n    return getFallbackImage(src, category);\n  };"""
          if old_compute in r:
              r = r.replace(old_compute, new_compute, 1)

          old_error = """  const handleError = () => {\n    if (isHero) {"""
          new_error = """  const handleError = () => {\n    if (disableFallback) {\n      setLoadPhase('placeholder');\n      setShowPlaceholder(true);\n      setIsLoading(false);\n      return;\n    }\n\n    if (isHero) {"""
          r = r.replace(old_error, new_error, 1)
          reg.write_text(r)

          # ---------------- ScrollZoomImage ----------------
          scroll = Path('src/components/ScrollZoomImage.tsx')
          z = scroll.read_text()
          z = z.replace("  priority?: boolean;\n}", "  priority?: boolean;\n  disableFallback?: boolean;\n}")
          z = z.replace("  category,\n  priority = false\n}: ScrollZoomImageProps)", "  category,\n  priority = false,\n  disableFallback = false\n}: ScrollZoomImageProps)")
          z = z.replace("           referrerPolicy={referrerPolicy}\n         />", "           referrerPolicy={referrerPolicy}\n           disableFallback={disableFallback}\n         />", 1)
          scroll.write_text(z)

          # ---------------- Collection ----------------
          portfolio = Path('src/components/Portfolio.tsx')
          p = portfolio.read_text()
          p = p.replace("import React, { useState, useEffect, useRef } from 'react';", "import React, { useState, useEffect, useMemo, useRef } from 'react';")
          p = p.replace("import { SafeImage, useGlobalProducts, resolveProductImage, normalizeCategory } from '../imageRegistry';", "import { useGlobalProducts, resolveProductImage, normalizeCategory } from '../imageRegistry';")
          if "import { categoryApi } from '../lib/categoryApi';" not in p:
              p = p.replace("import { Product } from '../types';", "import { Product } from '../types';\nimport { categoryApi } from '../lib/categoryApi';")

          # Remove unused static image configuration fields.
          p = re.sub(r"\n\s*defaultImg:\s*['\"][^'\"]+['\"],?", "", p)
          p = p.replace("          src={resolveProductImage(product)}", "          src={resolveProductImage(product, undefined, false)}\n          disableFallback")

          p = p.replace("  const [cmsBlocks, setCmsBlocks] = useState<any[]>([]);\n  const firstSectionRef", "  const [cmsBlocks, setCmsBlocks] = useState<any[]>([]);\n  const [cmsCategories, setCmsCategories] = useState<any[]>([]);\n  const firstSectionRef", 1)

          effect_pattern = re.compile(r"  useEffect\(\(\) => \{\n    fetch\('/api/homepage-editorial'\).*?\n  \}, \[\]\);", re.S)
          new_effect = """  useEffect(() => {\n    let active = true;\n\n    fetch('/api/homepage-editorial', { cache: 'no-store' })\n      .then(res => {\n        if (!res.ok) throw new Error(`Editorial request failed (${res.status})`);\n        return res.json();\n      })\n      .then(data => {\n        if (active && Array.isArray(data)) {\n          setCmsBlocks(data.filter((b: any) => b && b.status === 'published'));\n        }\n      })\n      .catch(err => console.warn('[Collection] Editorial CMS unavailable; static image fallback disabled.', err));\n\n    categoryApi.list()\n      .then(rows => {\n        if (active) setCmsCategories(Array.isArray(rows) ? rows : []);\n      })\n      .catch(err => console.warn('[Collection] Category CMS unavailable; static image fallback disabled.', err));\n\n    return () => {\n      active = false;\n    };\n  }, []);"""
          p, count = effect_pattern.subn(new_effect, p, count=1)
          if count != 1:
              raise SystemExit('Portfolio editorial effect anchor not found')

          anchor = "    const block = cmsBlocks.find(b => normalizeCategory(b.category) === target);"
          if anchor in p:
              p = p.replace(anchor, anchor + "\n    const categoryCms = cmsCategories.find((c: any) => normalizeCategory(c.slug || c.name) === target);", 1)

          p = re.sub(r"\n\s*const defaultImages: Record<string, string> = \{.*?\n\s*\};\n", "\n", p, flags=re.S)
          p = p.replace("      image: block.desktop_image || block.mobile_image,", "      image: block.desktop_image || block.mobile_image || categoryCms?.bannerImage || categoryCms?.featuredImage || categoryCms?.image || categoryCms?.imageUrl || '',")
          p = re.sub(r"\n\s*return \{\n\s*title: defaultTitle,\n\s*description: defaultDesc,\n\s*tag: defaultTag,\n\s*image: defaultImages\[target\] \|\| '[^']+'\n\s*\};", "\n    return {\n      title: defaultTitle,\n      description: defaultDesc,\n      tag: defaultTag,\n      image: categoryCms?.bannerImage || categoryCms?.featuredImage || categoryCms?.image || categoryCms?.imageUrl || ''\n    };", p, count=1)
          p = p.replace("            src=\"/images/collections/collection.png\"", "            src={collectionHeroImage}")
          p = p.replace("            src=\"/images/collections/collection.png\"", "            src={collectionHeroImage}")

          # Add strict flag to every Collection ScrollZoomImage; these images are CMS/category/product authority only.
          p = p.replace("          src={cmsContent.image}\n", "          src={cmsContent.image}\n                        disableFallback\n", 1)

          hero_anchor = "  const getCategoryProducts = (categoryName: string) => {"
          hero_block = """  const collectionHeroImage = useMemo(() => {\n    const editorial = cmsBlocks.find((b: any) => b && b.status === 'published' && (b.desktop_image || b.mobile_image));\n    if (editorial) return editorial.desktop_image || editorial.mobile_image || '';\n    const category = cmsCategories.find((c: any) => [c.bannerImage, c.featuredImage, c.image, c.imageUrl].some((value: any) => typeof value === 'string' && value.trim() !== ''));\n    return category?.bannerImage || category?.featuredImage || category?.image || category?.imageUrl || '';\n  }, [cmsBlocks, cmsCategories]);\n\n"""
          if hero_anchor in p and "const collectionHeroImage" not in p:
              p = p.replace(hero_anchor, hero_block + hero_anchor, 1)

          # Strictly use CMS/category imagery for hero and final CTA.
          p = p.replace("            priority={true}\n", "            priority={true}\n            disableFallback\n", 1)
          p = p.replace("          <ScrollZoomImage\n            src=\"/images/collections/collection.png\"", "          <ScrollZoomImage\n            src={collectionHeroImage}")
          # Final CTA image is the second collection background instance.
          p = p.replace("          <ScrollZoomImage\n            src=\"/images/collections/collection.png\"", "          <ScrollZoomImage\n            src={collectionHeroImage}")
          p = p.replace("            className=\"w-full h-full object-cover filter blur-[2px]\"\n", "            className=\"w-full h-full object-cover filter blur-[2px]\"\n            disableFallback\n", 1)

          portfolio.write_text(p)
          print('Strict Store/Collection CMS authority patch prepared')
          PY

      - name: Validate source authority
        run: |
          ! grep -n "images.unsplash.com" src/components/Store.tsx src/components/Portfolio.tsx
          ! grep -n "localStorage.getItem('zoal_admin_categories')\|localStorage.getItem('zoal_admin_brands')" src/components/Store.tsx
          ! grep -n "const PRESET_ASSETS" src/components/Store.tsx
          ! grep -n "defaultImg:" src/components/Portfolio.tsx
          grep -n "disableFallback" src/components/Store.tsx src/components/Portfolio.tsx src/components/ScrollZoomImage.tsx src/imageRegistry.tsx

      - name: Build validation
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Store.tsx src/components/Portfolio.tsx src/components/ScrollZoomImage.tsx src/imageRegistry.tsx
          if git diff --cached --quiet; then
            echo 'No source changes were required.'
          else
            git commit -m 'fix(store): enforce strict CMS image authority'
            git push origin HEAD:audit/dashboard-sync-fix
          fi
          if [ -f .github/workflows/one-time-store-collection-image-authority.yml ]; then
            git rm .github/workflows/one-time-store-collection-image-authority.yml
            git commit -m 'chore(audit): remove one-time storefront remediation workflow'
            git push origin HEAD:audit/dashboard-sync-fix
          fi
