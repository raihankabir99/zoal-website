name: One-Time Product Media Authority Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix
    paths:
      - '.github/PRODUCT_MEDIA_AUTHORITY_TRIGGER'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Apply product media authority fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/PmsSubTabs.tsx')
          text = p.read_text()

          old_fallback = '''        } else {
          // Fallback if Supabase is not configured or errors out
          const fallbackPath = `/products/${folder}/${Date.now()}_${file.name}`;
          if (actualTarget === 'images') {
            const current = [...(selectedPmsProduct.images || [])];
            current[0] = fallbackPath;
            saveProductFields(selectedPmsProduct.id, { images: current });
            addLog("Media Uploaded", `Uploaded featured image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'gallery') {
            const current = [...(selectedPmsProduct.images || [])];
            current.push(fallbackPath);
            saveProductFields(selectedPmsProduct.id, { images: current });
            addLog("Media Uploaded", `Uploaded gallery image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'variants') {
            setVariantImage(fallbackPath);
            addLog("Media Uploaded", `Uploaded variant image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'videos') {
            setVideoUrl(fallbackPath);
            saveProductFields(selectedPmsProduct.id, { videoUrl: fallbackPath });
            addLog("Media Uploaded", `Uploaded video to local fallback path: ${fallbackPath}`);
          }
          console.warn("Supabase upload failed, using local fallback path.", data?.error);
          alert(`Simulated local catalog upload path. (Supabase Storage offline. Path: /products/${folder}/${file.name})`);
        }'''

          new_fallback = '''        } else {
          // Fail closed: never publish a fake/local product-media path when Storage upload fails.
          console.error("Supabase Storage upload failed; product media reference was not changed.", data?.error);
          alert(`Upload failed. The product image/media was not changed because Supabase Storage did not confirm the upload.\n\n${data?.error || 'Please try again.'}`);
        }'''

          if old_fallback not in text:
              raise SystemExit('Expected upload fallback block not found')
          text = text.replace(old_fallback, new_fallback, 1)

          old_delete = '''                              onClick={() => {
                                const current = [...(selectedPmsProduct.images || [])];
                                current.splice(i + 1, 1);
                                saveProductFields(selectedPmsProduct.id, { images: current });
                                addLog("Product Updated", `Deleted gallery image from ${selectedPmsProduct.name}`);
                              }}'''
          new_delete = '''                              onClick={async () => {
                                const targetUrl = selectedPmsProduct.images?.[i + 1];
                                const current = [...(selectedPmsProduct.images || [])];
                                current.splice(i + 1, 1);

                                // Detach the image reference from the authoritative product record first.
                                saveProductFields(selectedPmsProduct.id, { images: current });

                                // Then remove the corresponding Supabase Storage object when the URL belongs to Storage.
                                if (targetUrl && targetUrl.includes('/storage/v1/')) {
                                  try {
                                    const pathMatch = targetUrl.match(/\/storage\/v1\/object\/public\/([^/]+)\/(.+)$/);
                                    if (pathMatch) {
                                      const [, bucket, objectPath] = pathMatch;
                                      const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';
                                      const response = await fetch('/api/storage/delete', {
                                        method: 'POST',
                                        headers: {
                                          'Content-Type': 'application/json',
                                          'Authorization': `Bearer ${token}`
                                        },
                                        body: JSON.stringify({ bucket, path: objectPath.split('?')[0] })
                                      });
                                      if (!response.ok) {
                                        console.warn('[Media] Product reference was detached, but Storage deletion was not confirmed:', await response.text());
                                      }
                                    }
                                  } catch (err) {
                                    console.warn('[Media] Storage deletion request failed after product reference detach:', err);
                                  }
                                }

                                addLog("Product Updated", `Deleted gallery image from ${selectedPmsProduct.name}`);
                              }}'''
          if old_delete not in text:
              raise SystemExit('Expected gallery delete handler not found')
          text = text.replace(old_delete, new_delete, 1)

          p.write_text(text)
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n "Simulated local catalog upload path" src/components/PmsSubTabs.tsx
          grep -n "Fail closed: never publish a fake/local product-media path" src/components/PmsSubTabs.tsx
          grep -n "api/storage/delete" src/components/PmsSubTabs.tsx

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-product-media-authority-fix.yml .github/PRODUCT_MEDIA_AUTHORITY_TRIGGER
          git add src/components/PmsSubTabs.tsx
          git commit -m "fix(media): keep product media authoritative to Supabase Storage"
          git push origin audit/dashboard-sync-fix
