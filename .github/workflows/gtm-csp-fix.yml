name: One-time GTM CSP Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1
      - name: Fix GTM CSP directive placement
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/security.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://*.run.app https://www.googletagmanager.com', 'https://*.run.app', 1)
          s = s.replace('https://*.google.com https://*.run.app",', 'https://*.google.com https://*.run.app https://www.googletagmanager.com",', 1)
          p.write_text(s, encoding='utf-8')
          text = p.read_text(encoding='utf-8')
          assert 'script-src' in text and 'https://www.googletagmanager.com' in text
          assert 'connect-src' in text and 'https://www.googletagmanager.com' in text
      - name: Commit and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtm-csp-fix.yml
          git add server/security.ts .github/workflows/gtm-csp-fix.yml
          git commit -m "fix(gtm): allow GTM connections through production CSP"
          git push origin audit/dashboard-sync-fix
