name: Forensic Dashboard Sync Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  apply-targeted-fixes:
    if: ${{ !contains(github.event.head_commit.message, 'apply targeted dashboard compile fixes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Apply verified compile fixes
        shell: python
        run: |
          from pathlib import Path

          # app.ts: import the Node crypto primitives already used by the code.
          app = Path('app.ts')
          text = app.read_text(encoding='utf-8')
          crypto_import = "import { randomBytes, createHash, timingSafeEqual } from 'crypto';\n"
          if "from 'crypto'" not in text and 'from "crypto"' not in text:
              anchor = "import { fileURLToPath } from 'url';\n"
              if anchor not in text:
                  raise SystemExit('app.ts anchor import not found; refusing unsafe edit')
              text = text.replace(anchor, anchor + crypto_import, 1)
          for symbol in ('randomBytes', 'createHash', 'timingSafeEqual'):
              if symbol not in text:
                  raise SystemExit(f'app.ts verification failed: {symbol} missing after edit')
          app.write_text(text, encoding='utf-8')

          # EnterpriseInventoryManagement.tsx: refresh from the existing authoritative
          # product sync path after inventory writes. No API/schema/routing changes.
          inv = Path('src/components/EnterpriseInventoryManagement.tsx')
          text = inv.read_text(encoding='utf-8')
          old_import = "import { updateProductInventory, updateProductFields, SafeImage, normalizeCategory } from '../imageRegistry';"
          new_import = "import { updateProductInventory, updateProductFields, SafeImage, normalizeCategory } from '../imageRegistry';\nimport { triggerProductFetch } from '../lib/productSync';"
          if 'triggerProductFetch' not in text:
              if old_import not in text:
                  raise SystemExit('inventory import anchor not found; refusing unsafe edit')
              text = text.replace(old_import, new_import, 1)

          marker = "  const isAdmin = userRole === 'admin';\n"
          refresh = "\n  // Re-read authoritative product state after inventory mutations.\n  const refreshProducts = async () => {\n    await triggerProductFetch(true);\n  };\n"
          if 'const refreshProducts = async () =>' not in text:
              if marker not in text:
                  raise SystemExit('inventory state anchor not found; refusing unsafe edit')
              text = text.replace(marker, marker + refresh, 1)

          for needle in ('triggerProductFetch', 'const refreshProducts = async () =>'):
              if needle not in text:
                  raise SystemExit(f'inventory verification failed: {needle} missing after edit')
          inv.write_text(text, encoding='utf-8')

      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.ts src/components/EnterpriseInventoryManagement.tsx .github/workflows/forensic-fix-dashboard-sync.yml
          git rm .github/workflows/forensic-fix-dashboard-sync.yml
          git diff --cached --check
          git commit -m "fix: apply targeted dashboard compile fixes"
          git push origin HEAD:audit/dashboard-sync-fix
