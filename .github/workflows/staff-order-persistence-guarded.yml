name: Staff Order Persistence Guarded Remediation
on:
  push:
    branches: [audit/dashboard-sync-fix]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(staff): bind order operations to authoritative API') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Apply guarded frontend persistence patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/EnterpriseOrderManagement.tsx')
          s = p.read_text(encoding='utf-8')

          old_staff = '''  // Mock staff list for assignment
  const STAFF_LIST = [
    { id: 'st-1', name: 'Support Ahmad', email: 'ahmad@zoal.sa' },
    { id: 'st-2', name: 'Master Roaster Khalid', email: 'khalid@zoal.sa' },
    { id: 'st-3', name: 'Fulfillment Yasir', email: 'yasir@zoal.sa' },
    { id: 'st-4', name: 'Logistics Hisham', email: 'hisham@zoal.sa' }
  ];'''
          new_staff = '''  // Authoritative staff list is loaded from the protected staff API.
  const [staffList, setStaffList] = useState<Array<{ id: string; name: string; email: string }>>([]);

  useEffect(() => {
    let cancelled = false;
    const loadStaff = async () => {
      try {
        const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token');
        if (!token) return;
        const response = await fetch('/api/staff', {
          method: 'GET',
          headers: { Authorization: `Bearer ${token}` },
          cache: 'no-store'
        });
        if (!response.ok) return;
        const result = await response.json();
        const rows = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];
        const mapped = rows.map((member: any) => ({
          id: String(member.id),
          name: [member.first_name, member.last_name].filter(Boolean).join(' ') || member.email,
          email: member.email || ''
        }));
        if (!cancelled) setStaffList(mapped);
      } catch {
        // No synthetic fallback: assignment controls remain empty when the authoritative API is unavailable.
      }
    };
    void loadStaff();
    return () => { cancelled = true; };
  }, []);

  const getAuthToken = () => localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token');'''
          if old_staff not in s: raise SystemExit('Staff-list guard failed; aborting without changes.')
          s = s.replace(old_staff, new_staff, 1)

          old_status = '''  const handleStatusTransition = (orderId: string, nextStatus: Order['status'], noteText?: string) => {
    const orderToUpdate = orders.find(o => o.id === orderId);
    if (!orderToUpdate) return;

    // Check if transition is valid, except for admin who can override status
    const validTransitions = getValidTransitions(orderToUpdate.status);
    if (userRole !== 'admin' && !validTransitions.includes(nextStatus)) {
      alert(`Invalid status transition from ${orderToUpdate.status} to ${nextStatus}.`);
      return;
    }

    setOrders(prev => prev.map(o => {
      if (o.id === orderId) {
        // Automatically mark payment status on Delivered or completed
        let updatedPaymentStatus = o.paymentStatus || 'Unpaid';
        if (nextStatus === 'Delivered' || nextStatus === 'Completed') {
          updatedPaymentStatus = 'Paid';
        } else if (nextStatus === 'Refund Completed') {
          updatedPaymentStatus = 'Refunded';
        }

        const newTimeline = {
          status: nextStatus,
          date: new Date().toISOString(),
          notes: noteText || `Order transitioned to ${nextStatus}`,
          updatedBy: currentUser?.name || 'System'
        };

        const newLog = {
          action: `Status Update: ${nextStatus}`,
          date: new Date().toISOString(),
          details: noteText || `Status transitioned to ${nextStatus}`,
          user: currentUser?.name || 'System'
        };

        return {
          ...o,
          status: nextStatus,
          paymentStatus: updatedPaymentStatus,
          timeline: [...(o.timeline || []), newTimeline],
          activityHistory: [newLog, ...(o.activityHistory || [])]
        };
      }
      return o;
    }));

    // Update locally selected view details
    if (selectedOrder?.id === orderId) {
      setSelectedOrder(prev => {
        if (!prev) return null;
        let updatedPaymentStatus = prev.paymentStatus || 'Unpaid';
        if (nextStatus === 'Delivered' || nextStatus === 'Completed') {
          updatedPaymentStatus = 'Paid';
        } else if (nextStatus === 'Refund Completed') {
          updatedPaymentStatus = 'Refunded';
        }
        return {
          ...prev,
          status: nextStatus,
          paymentStatus: updatedPaymentStatus,
          timeline: [...(prev.timeline || []), {
            status: nextStatus,
            date: new Date().toISOString(),
            notes: noteText || `Order transitioned to ${nextStatus}`,
            updatedBy: currentUser?.name || 'System'
          }],
          activityHistory: [{
            action: `Status Update: ${nextStatus}`,
            date: new Date().toISOString(),
            details: noteText || `Status transitioned to ${nextStatus}`,
            user: currentUser?.name || 'System'
          }, ...(prev.activityHistory || [])]
        };
      });
    }
  };'''
          new_status = '''  const handleStatusTransition = async (orderId: string, nextStatus: Order['status'], noteText?: string) => {
    const orderToUpdate = orders.find(o => o.id === orderId);
    if (!orderToUpdate) return;

    const validTransitions = getValidTransitions(orderToUpdate.status);
    if (userRole !== 'admin' && !validTransitions.includes(nextStatus)) {
      alert(`Invalid status transition from ${orderToUpdate.status} to ${nextStatus}.`);
      return;
    }

    const token = getAuthToken();
    if (!token) {
      alert('Authentication session unavailable. Please sign in again.');
      return;
    }

    try {
      const response = await fetch('/api/staff', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ orderId, status: nextStatus })
      });
      const result = await response.json().catch(() => null);
      if (!response.ok) throw new Error(result?.error || result?.message || `HTTP ${response.status}`);

      let updatedPaymentStatus = orderToUpdate.paymentStatus || 'Unpaid';
      if (nextStatus === 'Delivered' || nextStatus === 'Completed') updatedPaymentStatus = 'Paid';
      if (nextStatus === 'Refund Completed') updatedPaymentStatus = 'Refunded';
      const timestamp = new Date().toISOString();
      const details = noteText || `Status transitioned to ${nextStatus}`;
      const newTimeline = { status: nextStatus, date: timestamp, notes: details, updatedBy: currentUser?.name || 'System' };
      const newLog = { action: `Status Update: ${nextStatus}`, date: timestamp, details, user: currentUser?.name || 'System' };

      setOrders(prev => prev.map(o => o.id === orderId ? {
        ...o, status: nextStatus, paymentStatus: updatedPaymentStatus,
        timeline: [...(o.timeline || []), newTimeline],
        activityHistory: [newLog, ...(o.activityHistory || [])]
      } : o));
      setSelectedOrder(prev => prev?.id === orderId ? {
        ...prev, status: nextStatus, paymentStatus: updatedPaymentStatus,
        timeline: [...(prev.timeline || []), newTimeline],
        activityHistory: [newLog, ...(prev.activityHistory || [])]
      } : prev);
    } catch (error: any) {
      alert(error?.message || 'Failed to persist order status. No local change was applied.');
    }
  };'''
          if old_status not in s: raise SystemExit('Status-handler guard failed; aborting without changes.')
          s = s.replace(old_status, new_status, 1)

          old_assign = '''  const handleAssignStaff = (orderId: string, staffName: string) => {
    setOrders(prev => prev.map(o => {
      if (o.id === orderId) {
        return {
          ...o,
          assignedStaff: staffName,
          activityHistory: [{
            action: 'Staff Assigned',
            date: new Date().toISOString(),
            details: `Assigned order to staff member: ${staffName}`,
            user: currentUser?.name || 'Admin'
          }, ...(o.activityHistory || [])]
        };
      }
      return o;
    }));

    if (selectedOrder?.id === orderId) {
      setSelectedOrder(prev => prev ? { ...prev, assignedStaff: staffName } : null);
    }
  };'''
          new_assign = '''  const handleAssignStaff = async (orderId: string, staffName: string) => {
    const token = getAuthToken();
    if (!token) { alert('Authentication session unavailable. Please sign in again.'); return; }
    const staffMember = staffList.find(member => member.name === staffName || member.email === staffName);
    if (!staffMember && staffName) { alert('Selected staff member is not available from the authoritative staff directory.'); return; }
    try {
      const response = await fetch('/api/staff', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ orderId, assignedStaffId: staffMember?.id || '' })
      });
      const result = await response.json().catch(() => null);
      if (!response.ok) throw new Error(result?.error || result?.message || `HTTP ${response.status}`);
      const timestamp = new Date().toISOString();
      const newLog = { action: 'Staff Assigned', date: timestamp, details: `Assigned order to staff member: ${staffName || 'Unassigned'}`, user: currentUser?.name || 'Admin' };
      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, assignedStaff: staffName || undefined, activityHistory: [newLog, ...(o.activityHistory || [])] } : o));
      setSelectedOrder(prev => prev?.id === orderId ? { ...prev, assignedStaff: staffName || undefined } : prev);
    } catch (error: any) {
      alert(error?.message || 'Failed to persist staff assignment. No local change was applied.');
    }
  };'''
          if old_assign not in s: raise SystemExit('Assignment-handler guard failed; aborting without changes.')
          s = s.replace(old_assign, new_assign, 1)

          old_notes = '''  const handleSaveNotes = (type: 'admin' | 'staff' | 'customer') => {
    if (!selectedOrder) return;
    
    setOrders(prev => prev.map(o => {
      if (o.id === selectedOrder.id) {
        const update: Partial<Order> = {};
        if (type === 'admin') {
          update.adminNotes = adminNoteInput;
        } else if (type === 'staff') {
          update.staffNotes = staffNoteInput;
        } else if (type === 'customer') {
          update.customerNotes = customerNoteInput;
        }
        return {
          ...o,
          ...update,
          activityHistory: [{
            action: `${type.toUpperCase()} Notes Saved`,
            date: new Date().toISOString(),
            details: `Updated notes in order folder.`,
            user: currentUser?.name || 'System'
          }, ...(o.activityHistory || [])]
        };
      }
      return o;
    }));

    setSelectedOrder(prev => {
      if (!prev) return null;
      const update: Partial<Order> = {};
      if (type === 'admin') update.adminNotes = adminNoteInput;
      if (type === 'staff') update.staffNotes = staffNoteInput;
      if (type === 'customer') update.customerNotes = customerNoteInput;
      return { ...prev, ...update };
    });

    alert(`${type.toUpperCase()} notes updated successfully.`);
  };'''
          new_notes = '''  const handleSaveNotes = async (type: 'admin' | 'staff' | 'customer') => {
    if (!selectedOrder) return;
    const token = getAuthToken();
    if (!token) { alert('Authentication session unavailable. Please sign in again.'); return; }
    const value = type === 'admin' ? adminNoteInput : type === 'staff' ? staffNoteInput : customerNoteInput;
    try {
      const response = await fetch('/api/staff', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ orderId: selectedOrder.id, [`${type}Notes`]: value })
      });
      const result = await response.json().catch(() => null);
      if (!response.ok) throw new Error(result?.error || result?.message || `HTTP ${response.status}`);
      const update: Partial<Order> = type === 'admin' ? { adminNotes: value } : type === 'staff' ? { staffNotes: value } : { customerNotes: value };
      const timestamp = new Date().toISOString();
      const newLog = { action: `${type.toUpperCase()} Notes Saved`, date: timestamp, details: 'Updated notes in order folder.', user: currentUser?.name || 'System' };
      setOrders(prev => prev.map(o => o.id === selectedOrder.id ? { ...o, ...update, activityHistory: [newLog, ...(o.activityHistory || [])] } : o));
      setSelectedOrder(prev => prev ? { ...prev, ...update, activityHistory: [newLog, ...(prev.activityHistory || [])] } : null);
      alert(`${type.toUpperCase()} notes updated successfully.`);
    } catch (error: any) {
      alert(error?.message || `Failed to persist ${type} notes. No local change was applied.`);
    }
  };'''
          if old_notes not in s: raise SystemExit('Notes-handler guard failed; aborting without changes.')
          s = s.replace(old_notes, new_notes, 1)

          s = s.replace('STAFF_LIST.map', 'staffList.map')
          s = s.replace('STAFF_LIST.find', 'staffList.find')
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          git diff --check
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EnterpriseOrderManagement.tsx
          git diff --cached --check
          git commit -m 'fix(staff): bind order operations to authoritative API'
          git push origin audit/dashboard-sync-fix
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/staff-order-persistence-guarded.yml
          git commit -m 'chore(audit): remove temporary staff persistence workflow'
          git push origin audit/dashboard-sync-fix
