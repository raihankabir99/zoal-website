name: One-time CMS authoritative sync

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, '[cms-authoritative-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted CMS source remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/EnterpriseCmsManager.tsx')
          s = p.read_text()

          s = re.sub(r"  const \[homepageSections, setHomepageSections\] = useState<HomepageSection\[\]>\(\(\) => \{.*?\n  \}\);", "  const [homepageSections, setHomepageSections] = useState<HomepageSection[]>([]);", s, flags=re.S, count=1)
          s = re.sub(r"  const \[banners, setBanners\] = useState<Banner\[\]>\(\(\) => \{.*?\n  \}\);", "  const [banners, setBanners] = useState<Banner[]>([]);", s, flags=re.S, count=1)
          s = re.sub(r"  const \[webPages, setWebPages\] = useState<WebPage\[\]>\(\(\) => \{.*?\n  \}\);", "  const [webPages, setWebPages] = useState<WebPage[]>([]);", s, flags=re.S, count=1)

          s = re.sub(r"  const \[userRole, setUserRole\] = useState<'owner' \| 'admin' \| 'staff' \| 'customer'>\(\(\) => \{.*?\n  \}\);\n", "", s, flags=re.S, count=1)
          s = s.replace('userRole.toUpperCase()', "String(currentUser?.role || 'unknown').toUpperCase()")

          anchor = "  // --- EDITORIAL LOOKBOOK STATE & HANDLERS ---"
          if "const fetchAuthoritativeCmsData = useCallback" not in s:
              insert = '''  // --- AUTHORITATIVE CMS DATA BOOTSTRAP ---\n  const fetchAuthoritativeCmsData = useCallback(async () => {\n    try {\n      const response = await fetch('/api/cms');\n      if (!response.ok) throw new Error(`CMS API returned HTTP ${response.status}`);\n      const data = await response.json();\n\n      if (Array.isArray(data.homepageSections)) {\n        setHomepageSections(data.homepageSections.map((item: any, index: number) => ({\n          id: String(item.section_key ?? item.id),\n          name: String(item.title ?? item.section_key ?? `Section ${index + 1}`),\n          enabled: Boolean(item.is_active),\n          order: Number(item.display_order ?? index + 1),\n          publishAt: item.schedule_start ? String(item.schedule_start) : '',\n          expireAt: item.schedule_end ? String(item.schedule_end) : ''\n        })));\n      }\n\n      if (Array.isArray(data.heroes)) {\n        setBanners(data.heroes.map((hero: any) => ({\n          id: String(hero.id),\n          type: 'homepage',\n          title: String(hero.hero_title ?? ''),\n          subtitle: String(hero.hero_subtitle ?? ''),\n          description: String(hero.hero_description ?? ''),\n          buttonText: String(hero.cta_text ?? ''),\n          buttonLink: String(hero.cta_link ?? ''),\n          bgImage: String(hero.hero_image_desktop ?? ''),\n          mobileImage: String(hero.hero_image_mobile ?? ''),\n          priority: Number(hero.priority ?? 0),\n          scheduleStart: hero.start_date ? String(hero.start_date) : '',\n          scheduleEnd: hero.end_date ? String(hero.end_date) : '',\n          status: hero.active ? 'published' : 'archived',\n          animation: 'fade'\n        })) as Banner[]);\n      }\n\n      if (Array.isArray(data.pages)) {\n        setWebPages(data.pages.map((page: any) => {\n          const contentJson = page.content_json && typeof page.content_json === 'object' ? page.content_json : {};\n          return {\n            id: String(page.id),\n            key: String(page.slug ?? page.id),\n            title: String(page.title ?? ''),\n            content: String(contentJson.content ?? contentJson.body ?? ''),\n            images: Array.isArray(contentJson.images) ? contentJson.images : [],\n            videos: Array.isArray(contentJson.videos) ? contentJson.videos : [],\n            seoTitle: String(contentJson.seo_title ?? ''),\n            seoDesc: String(contentJson.seo_description ?? ''),\n            status: 'published',\n            lastModified: String(page.updated_at ?? page.created_at ?? ''),\n            revisionHistory: []\n          };\n        }));\n      }\n    } catch (error) {\n      console.error('[CMS] Authoritative bootstrap failed:', error);\n    }\n  }, []);\n\n  useEffect(() => {\n    void fetchAuthoritativeCmsData();\n  }, [fetchAuthoritativeCmsData]);\n\n'''
              if anchor not in s:
                  raise SystemExit('CMS bootstrap anchor not found')
              s = s.replace(anchor, insert + anchor, 1)

          for pattern in [
              r"\s*localStorage\.setItem\('cms_homepage_sections', JSON\.stringify\(homepageSections\)\);",
              r"\s*localStorage\.setItem\('cms_banners', JSON\.stringify\(banners\)\);",
              r"\s*localStorage\.setItem\('cms_web_pages', JSON\.stringify\(nonLegalPages\)\);"
          ]:
              s = re.sub(pattern, '', s, count=1)

          start = s.find("          {/* 2. Interactive Role Swapper (RBAC simulation) */}")
          if start != -1:
              end = s.find("\n\n          {/* 3. English/Arabic RTL Switcher */}", start)
              if end == -1:
                  raise SystemExit('role swapper end marker not found')
              replacement = '''          {/* 2. Server-authoritative role indicator */}\n          <div className="flex items-center gap-1.5 bg-zinc-900 border border-white/5 py-1 px-2.5 rounded-xs">\n            <Shield className="w-3.5 h-3.5 text-gold-pure" />\n            <span className="text-[9.5px] uppercase tracking-wider font-mono text-zinc-300">\n              Role: {String(currentUser?.role || 'unknown').toUpperCase()}\n            </span>\n          </div>'''
              s = s[:start] + replacement + s[end:]

          s = s.replace("setUserRole('admin');", "")
          s = s.replace("setUserRole('staff');", "")
          s = s.replace("setUserRole('customer');", "")

          p.write_text(s)
          PY
          git diff --check
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseCmsManager.tsx
          git commit -m "fix(cms): use authoritative CMS bootstrap and remove client role simulation [cms-authoritative-sync]"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-cms-authoritative-sync.yml
          git commit -m "chore(cms): remove one-time authoritative sync workflow [cms-authoritative-sync]"
          git push
