name: One-time Staff Dashboard Compile Fix
on:
  push:
    branches: [audit/dashboard-sync-fix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Remove self-shadowing staffMemberCount declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/StaffDashboard.tsx')
          s = p.read_text()
          bad = '  const staffMemberCount = staffMemberCount;\n'
          if bad not in s:
              raise SystemExit('Expected bad declaration not found')
          s = s.replace(bad, '', 1)
          p.write_text(s)
          PY
      - name: Commit remediation and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StaffDashboard.tsx
          git commit -m 'fix(staff): remove self-shadowing staff member count declaration'
          git rm .github/workflows/one-time-staff-dashboard-compile-fix.yml
          git commit -m 'chore(audit): remove one-time staff compile workflow'
          git push origin audit/dashboard-sync-fix
