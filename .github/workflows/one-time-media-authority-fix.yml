name: One-Time Product Media Authority Remediation

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, 'one-time product media authority remediation') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch authoritative media flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/PmsSubTabs.tsx')
          s = p.read_text()

          old = '''        } else {
          // Fallback if Supabase is not configured or errors out
          const fallbackPath = `/products/${folder}/${Date.now()}_${file.name}`;
          if (actualTarget === 'images') {
            const current = [...(selectedPmsProduct.images || [])];
            current[0] = fallbackPath;
            saveProductFields(selectedPmsProduct.id, { images: current });
            addLog("Media Uploaded", `Uploaded featured image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'gallery') {
            const current = [...(selectedPmsProduct.images || [])];
            current.push(fallbackPath);
            saveProductFields(selectedPmsProduct.id, { images: current });
            addLog("Media Uploaded", `Uploaded gallery image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'variants') {
            setVariantImage(fallbackPath);
            addLog("Media Uploaded", `Uploaded variant image to local fallback path: ${fallbackPath}`);
          } else if (actualTarget === 'videos') {
            setVideoUrl(fallbackPath);
            saveProductFields(selectedPmsProduct.id, { videoUrl: fallbackPath });
            addLog("Media Uploaded", `Uploaded product video to local fallback path: ${fallbackPath}`);
          }
          console.warn("Supabase upload failed, using local fallback path.", data?.error);
          alert(`Simulated local catalog upload path. (Supabase Storage offline. Path: /products/${folder}/${file.name})`);
        }'''
          new = '''        } else {
          console.error("[PMS] Supabase Storage upload failed; media reference was not persisted.", data?.error);
          alert(data?.error || "Supabase Storage upload failed. No local or fake media path was saved.");
        }'''
          if old not in s:
              raise SystemExit('Expected upload fallback block not found')
          s = s.replace(old, new, 1)

          old_delete = '''                              onClick={() => {
                                const current = [...(selectedPmsProduct.images || [])];
                                current.splice(i + 1, 1);
                                saveProductFields(selectedPmsProduct.id, { images: current });
                                addLog("Product Updated", `Deleted gallery image from ${selectedPmsProduct.name}`);
                              }}'''
          new_delete = '''                              onClick={async () => {
                                const current = [...(selectedPmsProduct.images || [])];
                                const removedUrl = current[i + 1];
                                current.splice(i + 1, 1);
                                const saved = await saveProductFields(selectedPmsProduct.id, {
                                  images: current,
                                  explicitImageDeletion: current.length === 0
                                });
                                if (!saved) {
                                  alert("Product image reference could not be saved. Storage deletion was skipped.");
                                  return;
                                }
                                addLog("Product Updated", `Deleted gallery image from ${selectedPmsProduct.name}`);
                                await deleteDetachedProductStorageAsset(removedUrl);
                              }}'''
          if old_delete not in s:
              raise SystemExit('Expected gallery delete handler not found')
          s = s.replace(old_delete, new_delete, 1)

          marker = "  // --- SAVE ACTIONS ---\n"
          helper = '''  const deleteDetachedProductStorageAsset = async (rawUrl?: string) => {
    if (!rawUrl || typeof rawUrl !== 'string') return;
    const cleaned = rawUrl.trim();
    if (!cleaned.startsWith('https://')) return;

    try {
      const parsed = new URL(cleaned);
      const storagePrefix = '/storage/v1/object/public/products/';
      if (!parsed.pathname.includes(storagePrefix)) return;
      const filePath = decodeURIComponent(parsed.pathname.split(storagePrefix)[1] || '').replace(/^\\/+/, '');
      if (!filePath) return;

      const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';
      if (!token) {
        console.warn('[PMS] No auth token available; skipped Storage object deletion.', filePath);
        return;
      }

      const response = await fetch('/api/storage/delete', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ bucket: 'products', path: filePath })
      });

      const result = await response.json().catch(() => null);
      if (!response.ok || !result?.success) {
        console.warn('[PMS] Storage object delete failed; DB reference remains authoritative.', filePath, result?.error);
        return;
      }

      if (result.skipped) {
        console.info('[PMS] Storage object preserved because it is still referenced elsewhere.', filePath, result.references);
      } else if (result.deleted) {
        console.info('[PMS] Detached product Storage object deleted.', filePath);
      }
    } catch (error) {
      console.warn('[PMS] Could not delete detached product Storage object.', error);
    }
  };

'''
          if marker not in s:
              raise SystemExit('Save actions marker not found')
          s = s.replace(marker, marker + helper, 1)
          p.write_text(s)

          # Make AdminDashboard product saves await the actual authoritative API write.
          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text()
          s = s.replace('  const handleSaveProduct = (e: React.FormEvent) => {', '  const handleSaveProduct = async (e: React.FormEvent) => {', 1)
          old_save = '''      saveProductToSupabase(fullProduct);
      addLog(`${isEditing ? 'Updated' : 'Added'} Product: ${formState.name} (${fullProduct.id})`);

      setIsAddProductOpen(false);'''
          new_save = '''      const persisted = await saveProductToSupabase(fullProduct);
      if (!persisted) {
        throw new Error('Product was not persisted to the authoritative database.');
      }
      addLog(`${isEditing ? 'Updated' : 'Added'} Product: ${formState.name} (${fullProduct.id})`);

      setIsAddProductOpen(false);'''
          if old_save not in s:
              raise SystemExit('Expected AdminDashboard save call not found')
          s = s.replace(old_save, new_save, 1)
          p.write_text(s)

          print('patched source')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PmsSubTabs.tsx src/components/AdminDashboard.tsx
          git diff --cached --check
          git commit -m "fix: enforce authoritative product media persistence and deletion"
          git push origin audit/dashboard-sync-fix

      - name: Remove one-time remediation workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-media-authority-fix.yml
          git rm -f .github/PRODUCT_MEDIA_AUTHORITY_TRIGGER 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(audit): remove one-time product media authority remediation"
          git push origin audit/dashboard-sync-fix
