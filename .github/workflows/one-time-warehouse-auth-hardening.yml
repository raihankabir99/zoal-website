name: one-time-warehouse-auth-hardening
on:
  push:
    branches:
      - audit/dashboard-sync-fix
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Patch warehouse client auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/WarehouseManagement.tsx')
          s = p.read_text()
          old = """  const fetchWarehouses = async (isSilent = false) => {\n    if (!isSilent) setRefreshing(true);\n    try {\n      const res = await fetch('/api/warehouses');"""
          new = """  const getAuthHeaders = () => {\n    const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';\n    return token ? { Authorization: `Bearer ${token}` } : {};\n  };\n\n  const fetchWarehouses = async (isSilent = false) => {\n    if (!isSilent) setRefreshing(true);\n    try {\n      const res = await fetch('/api/warehouses', { headers: getAuthHeaders() });"""
          if old not in s: raise SystemExit('fetchWarehouses anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("headers: { 'Content-Type': 'application/json' },", "headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },")
          old_delete = """      const res = await fetch(`/api/warehouses/${selectedWarehouse.id}`, {\n        method: 'DELETE'\n      });"""
          new_delete = """      const res = await fetch(`/api/warehouses/${selectedWarehouse.id}`, {\n        method: 'DELETE',\n        headers: getAuthHeaders()\n      });"""
          if old_delete not in s: raise SystemExit('delete anchor not found')
          s = s.replace(old_delete, new_delete, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "zoal-warehouse-hardening"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/WarehouseManagement.tsx
          git commit -m "fix(warehouses): send authenticated API requests from management UI"
          git rm .github/workflows/one-time-warehouse-auth-hardening.yml
          git commit -m "chore(warehouses): remove one-time hardening workflow"
          git push origin audit/dashboard-sync-fix
