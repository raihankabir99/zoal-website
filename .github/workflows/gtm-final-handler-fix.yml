name: One-time GTM Final Handler Fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1
      - name: Replace GTM action handlers safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          def replace_handler(s, anchor, handler):
              idx = s.find(anchor)
              assert idx >= 0, f'anchor not found: {anchor}'
              start = s.rfind('onClick=', 0, idx)
              assert start >= 0, f'onClick not found before: {anchor}'
              end = s.find('\n                            className=', idx)
              assert end >= 0, f'className end not found: {anchor}'
              return s[:start] + handler + s[end:]

          save_handler = '''onClick={async () => {
                              try {
                                const data = await saveGtmSettings(false);
                                setGtmStatus('Draft');
                                addLog('Saved GTM production draft configuration');
                                setGtmFeedback('GTM configuration saved to the production database as a disabled draft.');
                                if (data) setGtmContainerId(data.container_id || '');
                              } catch (error: any) {
                                console.error('[Admin] GTM draft save failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to save GTM configuration.'}`);
                              }
                            }}'''

          enable_handler = '''onClick={async () => {
                              try {
                                const data = await saveGtmSettings(true);
                                setGtmStatus('Enabled');
                                addLog('Enabled GTM site-side container injection');
                                setGtmFeedback('GTM is enabled in production. The site will load the saved container after consent.');
                                if (data) setGtmContainerId(data.container_id || '');
                              } catch (error: any) {
                                console.error('[Admin] GTM enable failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to enable GTM.'}`);
                              }
                            }}'''

          disable_handler = '''onClick={async () => {
                              try {
                                await saveGtmSettings(false);
                                setGtmStatus('Disabled');
                                addLog('Disabled GTM site-side container injection');
                                setGtmFeedback('GTM site-side injection is disabled in the production database.');
                              } catch (error: any) {
                                console.error('[Admin] GTM disable failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to disable GTM.'}`);
                              }
                            }}'''

          activate_handler = '''onClick={async () => {
                              try {
                                const data = await saveGtmSettings(true);
                                setGtmStatus('Enabled');
                                const newVerNum = gtmVersions.length + 1;
                                setGtmVersions(prev => [{
                                  version: `v${newVerNum}`,
                                  status: 'Site Activated',
                                  containerId: data.container_id,
                                  environment: data.environment,
                                  createdBy: currentUser?.name || 'Admin',
                                  createdAt: new Date().toLocaleString(),
                                  publishedAt: new Date().toLocaleString()
                                }, ...prev]);
                                addLog(`Activated GTM site configuration v${newVerNum}`);
                                setGtmFeedback('GTM site configuration is active. This action does not publish a version inside the Google Tag Manager workspace.');
                              } catch (error: any) {
                                console.error('[Admin] GTM activation failed:', error);
                                setGtmFeedback(`Error: ${error?.message || 'Unable to activate GTM.'}`);
                              }
                            }}'''

          s = replace_handler(s, "const actionMsg = 'Saved GTM UI Draft';", save_handler)
          s = replace_handler(s, "const actionMsg = 'Enabled GTM Tag Container (UI Local)';", enable_handler)
          s = replace_handler(s, "const actionMsg = 'Disabled GTM Tag Container (UI Local)';", disable_handler)
          s = replace_handler(s, "const newVerNum = gtmVersions.length + 1;", activate_handler)
          s = s.replace("setGtmContainerId('GTM-ZOALHQ');", "setGtmContainerId(v.containerId || '');")
          s = s.replace('UI Preview Mode • Server persistence & production backend API integrations are not yet connected.', 'Production configuration mode • GTM is database-backed; other third-party integrations remain intentionally empty.')
          s = s.replace('Local UI State • Production GTM script injection & server persistence not connected', 'Production GTM configuration • Container ID is stored in Supabase and site injection is consent-aware')
          p.write_text(s, encoding='utf-8')

          text = p.read_text(encoding='utf-8')
          assert "const actionMsg = 'Saved GTM UI Draft';" not in text
          assert "const actionMsg = 'Enabled GTM Tag Container (UI Local)';" not in text
          assert "const actionMsg = 'Disabled GTM Tag Container (UI Local)';" not in text
          assert "setGtmContainerId('GTM-ZOALHQ');" not in text
          assert 'const saveGtmSettings = async (enabled: boolean)' in text
      - name: Commit and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gtm-final-handler-fix.yml
          git add src/components/AdminDashboard.tsx .github/workflows/gtm-final-handler-fix.yml
          git commit -m "fix(gtm): finalize production action handlers"
          git push origin audit/dashboard-sync-fix
