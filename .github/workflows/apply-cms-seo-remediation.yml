name: Apply CMS SEO remediation

on:
  push:
    branches: [audit/dashboard-sync-fix]
    paths:
      - '.github/workflows/apply-cms-seo-remediation.yml'
      - 'scripts/apply-cms-seo-remediation.mjs'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0
      - name: Apply source remediation
        run: node scripts/apply-cms-seo-remediation.mjs
      - name: Verify required source changes
        run: |
          grep -F "'seo.global'" server/cms.ts
          test -f src/components/CmsGlobalSeoPanel.tsx
          grep -F "CmsGlobalSeoPanel" src/components/EnterpriseCmsManager.tsx
          grep -F "cmsGlobalSeo" src/components/SEO.tsx
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cms.ts src/components/EnterpriseCmsManager.tsx src/components/SEO.tsx src/components/CmsGlobalSeoPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(cms): wire authoritative global SEO settings"
          git push origin audit/dashboard-sync-fix
