name: Verify Brands CRUD
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify Brands CRUD patch is present
        run: python3 .github/scripts/patch-brands-crud.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build verification
        run: npm run build
