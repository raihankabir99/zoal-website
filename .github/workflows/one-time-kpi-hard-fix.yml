name: One-time KPI Hard Fix
on:
  push:
    branches: [audit/dashboard-sync-fix]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(kpi): complete target route and manager access') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Guarded KPI route patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.ts')
          s = p.read_text(encoding='utf-8')
          old = """// KPI Engine Routes
app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.getKpiData);
app.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.setKpiTarget);"""
          new = """// KPI Engine Routes
// Keep KPI access aligned with the Admin Dashboard manager access policy.
app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.getKpiData);
app.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.setKpiTarget);
app.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.deleteKpiTarget);"""
          if old not in s:
              raise SystemExit('Guard failed: expected KPI route block not found; refusing to modify app.ts.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Build and type verification
        run: |
          npm ci
          npm run build
          npm run lint
      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-kpi-hard-fix.yml
          git add app.ts .github/workflows/one-time-kpi-hard-fix.yml
          git diff --cached --check
          git commit -m 'fix(kpi): complete target route and manager access'
          git push origin audit/dashboard-sync-fix
