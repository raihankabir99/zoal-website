name: Staff Dashboard Build Repair

on:
  push:
    branches: [audit/dashboard-sync-fix]
    paths:
      - 'src/components/StaffDashboard.tsx'
      - '.github/workflows/staff-dashboard-build-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'SKIP_STAFF_REPAIR')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1
      - name: Repair exact build-breaking anchors
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/StaffDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          bad_button = '''                    <button\n                      onClick={() => { void handleStaffPasswordChange(); }}\n                      disabled={staffPasswordLoading}\n                      {staffPasswordFeedback}\n                      className="w-full py-3 bg-[#D4AF37] hover:bg-white text-black font-bold uppercase tracking-widest text-[9.5px] rounded-xs transition-colors cursor-pointer animate-none"\n                    >'''
          good_button = '''                    {staffPasswordFeedback}\n                    <button\n                      onClick={() => { void handleStaffPasswordChange(); }}\n                      disabled={staffPasswordLoading}\n                      className="w-full py-3 bg-[#D4AF37] hover:bg-white text-black font-bold uppercase tracking-widest text-[9.5px] rounded-xs transition-colors cursor-pointer animate-none"\n                    >'''
          if bad_button in s:
              s = s.replace(bad_button, good_button, 1)

          lines = s.splitlines()
          out = []
          i = 0
          replacements = {
              'value={returnsConfig.nonReturnableEn.join(': "                        value={returnsConfig.nonReturnableEn.join('\\n')}",
              'value={returnsConfig.nonReturnableAr.join(': "                        value={returnsConfig.nonReturnableAr.join('\\n')}",
              'value={returnsConfig.exchangeOptionsEn.join(': "                          value={returnsConfig.exchangeOptionsEn.join('\\n')}",
              'value={returnsConfig.exchangeOptionsAr.join(': "                          value={returnsConfig.exchangeOptionsAr.join('\\n')}",
          }
          split_replacements = {
              'nonReturnableEn: e.target.value.split(': "                        onChange={(e) => setLocalReturnsConfig({ ...returnsConfig, nonReturnableEn: e.target.value.split('\\n') })}",
              'nonReturnableAr: e.target.value.split(': "                        onChange={(e) => setLocalReturnsConfig({ ...returnsConfig, nonReturnableAr: e.target.value.split('\\n') })}",
              'exchangeOptionsEn: e.target.value.split(': "                          onChange={(e) => setLocalReturnsConfig({ ...returnsConfig, exchangeOptionsEn: e.target.value.split('\\n') })}",
              'exchangeOptionsAr: e.target.value.split(': "                          onChange={(e) => setLocalReturnsConfig({ ...returnsConfig, exchangeOptionsAr: e.target.value.split('\\n') })}",
          }
          while i < len(lines):
              line = lines[i]
              handled = False
              for needle, replacement in replacements.items():
                  if needle in line:
                      out.append(replacement)
                      i += 1
                      if i < len(lines) and "')}" in lines[i]:
                          i += 1
                      handled = True
                      break
              if handled:
                  continue
              for needle, replacement in split_replacements.items():
                  if needle in line:
                      out.append(replacement)
                      i += 1
                      handled = True
                      break
              if handled:
                  continue
              out.append(line)
              i += 1
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
      - name: Static verification
        run: |
          grep -n "staffPasswordFeedback" src/components/StaffDashboard.tsx
          grep -n "nonReturnableEn.join" src/components/StaffDashboard.tsx
          grep -n "nonReturnableAr.join" src/components/StaffDashboard.tsx
          grep -n "exchangeOptionsEn.join" src/components/StaffDashboard.tsx
          grep -n "exchangeOptionsAr.join" src/components/StaffDashboard.tsx
          grep -n "nonReturnableEn: e.target.value.split" src/components/StaffDashboard.tsx
          grep -n "nonReturnableAr: e.target.value.split" src/components/StaffDashboard.tsx
          grep -n "exchangeOptionsEn: e.target.value.split" src/components/StaffDashboard.tsx
          grep -n "exchangeOptionsAr: e.target.value.split" src/components/StaffDashboard.tsx
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StaffDashboard.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'fix(staff): repair all returns textarea literals'
          git push origin audit/dashboard-sync-fix
