name: Patch dashboard metrics once

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-metrics-once.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch AdminDashboard metrics to authoritative API
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/AdminDashboard.tsx')
          text = path.read_text(encoding='utf-8')

          if "const [serverDashboardData, setServerDashboardData]" not in text:
              marker = "  const [dashboardSyncState, setDashboardSyncState] = useState<'unknown' | 'refreshing' | 'verified' | 'failed'>('unknown');\n"
              insert = marker + "  const [serverDashboardData, setServerDashboardData] = useState<any | null>(null);\n"
              if marker not in text:
                  raise SystemExit('dashboard state marker not found')
              text = text.replace(marker, insert, 1)

          start = text.index("  const refreshDashboardData = async () => {")
          end = text.index("\n  useEffect(() => {", start)
          new_refresh = '''  const refreshDashboardData = async () => {
    setDashboardSyncState('refreshing');
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.access_token) throw new Error('No active authenticated session');

      const response = await fetch('/api/admin/dashboard-analytics', {
        headers: { Authorization: `Bearer ${session.access_token}` },
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(`Dashboard verification failed (${response.status})`);

      const data = await response.json();
      if (!data?.metrics || !Array.isArray(data?.revenueTrendData) || !Array.isArray(data?.categoryPerformanceData)) {
        throw new Error('Dashboard analytics response is incomplete');
      }

      setServerDashboardData(data);
      setDashboardSyncState('verified');
      addLog('Dashboard server data synchronized successfully');
    } catch (error) {
      console.error('Dashboard refresh verification failed:', error);
      setDashboardSyncState('failed');
      setServerDashboardData(null);
      addLog('Dashboard server data synchronization failed');
    }
  };
'''
          text = text[:start] + new_refresh + text[end:]

          effect_marker = "  useEffect(() => {\n    if (initialTab) {\n      setActiveTab(initialTab);\n    }\n  }, [initialTab]);\n"
          effect_insert = effect_marker + "\n  useEffect(() => {\n    refreshDashboardData();\n  }, []);\n"
          if "  useEffect(() => {\n    refreshDashboardData();\n  }, []);" not in text:
              if effect_marker not in text:
                  raise SystemExit('initialTab effect marker not found')
              text = text.replace(effect_marker, effect_insert, 1)

          metrics_start = text.index("  // Helper calculations for dynamic metrics")
          metrics_end = text.index("\n  // Start Create Product", metrics_start)
          replacement = '''  // Dashboard metrics are server-authoritative. No synthetic or local order-derived fallback is used.
  const metrics = useMemo(() => ({
    totalRevenue: Number(serverDashboardData?.metrics?.totalRevenue || 0),
    todaySales: Number(serverDashboardData?.metrics?.monthlySales || 0),
    monthlySales: Number(serverDashboardData?.metrics?.monthlySales || 0),
    totalOrders: Number(serverDashboardData?.metrics?.totalOrders || 0),
    pendingOrders: Number(serverDashboardData?.metrics?.pendingOrders || 0),
    preparingOrders: Number(serverDashboardData?.metrics?.preparingOrders || 0),
    shippedOrders: Number(serverDashboardData?.metrics?.shippedOrders || 0),
    deliveredOrders: Number(serverDashboardData?.metrics?.deliveredOrders || 0),
    cancelledOrders: Number(serverDashboardData?.metrics?.cancelledOrders || 0),
    totalCustomers: Number(serverDashboardData?.metrics?.totalCustomers || 0),
    totalStaff: Number(serverDashboardData?.metrics?.totalStaff || 0),
    totalProductsCount: Number(serverDashboardData?.metrics?.totalProductsCount || 0),
    lowStockCount: Number(serverDashboardData?.metrics?.lowStockCount || 0),
    outOfStockCount: Number(serverDashboardData?.metrics?.outOfStockCount || 0)
  }), [serverDashboardData]);

  const revenueTrendData = serverDashboardData?.revenueTrendData || [];
  const categoryPerformanceData = serverDashboardData?.categoryPerformanceData || [];

  // No fabricated fallback data: until the authoritative endpoint responds, the chart is empty.
  const bestSellingProductsData: { name: string; qty: number }[] = [];
'''
          text = text[:metrics_start] + replacement + text[metrics_end:]

          path.write_text(text, encoding='utf-8')

          # Guardrails: old synthetic dashboard metric block and fabricated chart seeds must be gone.
          banned = [
              "const monthlySales = totalRevenue;",
              "const totalStaff = 5;",
              "metrics.totalRevenue * 0.4",
              "{ name: 'Jan', sales: metrics.totalRevenue * 0.4",
              "{ name: 'Saffron Latte', qty: 32 }",
              "const counts = { coffee: 0, bakery: 0, market: 0, fashion: 0, thobes: 0 };"
          ]
          current = path.read_text(encoding='utf-8')
          for item in banned:
              if item in current:
                  raise SystemExit(f'banned synthetic dashboard content remains: {item}')

      - name: Build verify
        run: |
          npm ci
          npm run build

      - name: Commit and self-remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminDashboard.tsx .github/workflows/patch-dashboard-metrics-once.yml
          git rm .github/workflows/patch-dashboard-metrics-once.yml
          git commit -m 'fix(admin): bind dashboard metrics to authoritative analytics API'
          git push origin HEAD:audit/dashboard-sync-fix
