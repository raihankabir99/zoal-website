name: cms-four-settings-authoritative
on:
  push:
    branches:
      - audit/dashboard-sync-fix
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe authoritative settings patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/components/EnterpriseCmsManager.tsx')
          s=p.read_text()
          old_menu="""  const [menuItems, setMenuItems] = useState<MenuItem[]>(() => {
            const raw = localStorage.getItem('cms_menu_items');
            if (raw) return JSON.parse(raw);
            return [
              { id: 'menu-1', label: 'Boutique Sanctuary', link: '#store', icon: 'Compass', displayOrder: 1, external: false },
              { id: 'menu-2', label: 'The Coffee Roasters', link: '#coffee', icon: 'Sparkles', displayOrder: 2, external: false },
              { id: 'menu-3', label: 'Artisanal Bakery', link: '#bakery', icon: 'Award', displayOrder: 3, external: false },
              { id: 'menu-4', label: 'Premium Sudanese Toob', link: '#fashion', icon: 'FileText', displayOrder: 4, external: false },
              { id: 'menu-5', label: 'The Saudi Flagships', link: '#branches', icon: 'MapPin', displayOrder: 5, external: false }
            ];
          });"""
          new_menu="""  const [menuItems, setMenuItems] = useState<MenuItem[]>([]);"""
          if old_menu not in s: raise SystemExit('menu initializer not found')
          s=s.replace(old_menu,new_menu,1)

          start=s.index("  const [footerSettings, setFooterSettings]")
          end=s.index("\n\n  const [announcement, setAnnouncement]",start)
          s=s[:start]+"  const [footerSettings, setFooterSettings] = useState<FooterSettings>({\n    companyInfo: '', address: '', phone: '', email: '', workingHours: '',\n    socialLinks: {}, paymentIcons: [], certifications: [], copyright: '', mapEmbedUrl: ''\n  });"+s[end:]

          start=s.index("  const [announcement, setAnnouncement]")
          end=s.index("\n\n  const [popup, setPopup]",start)
          s=s[:start]+"  const [announcement, setAnnouncement] = useState<AnnouncementSettings>({\n    enabled: false, text: '', bgCol: '#D4AF37', txtCol: '#000000', btnText: '', btnLink: '',\n    countdownEnd: '', scheduleStart: '', scheduleEnd: ''\n  });"+s[end:]

          start=s.index("  const [popup, setPopup]")
          end=s.index("\n\n\n  // Recent changes log",start)
          s=s[:start]+"  const [popup, setPopup] = useState<PopupSettings>({\n    enabled: false, type: 'newsletter', title: '', content: '', imageUrl: '', videoUrl: '',\n    couponCode: '', rule: 'first_visit', ruleSeconds: 5, status: 'inactive'\n  });"+s[end:]

          marker="""  useEffect(() => {
            void fetchAuthoritativeCmsData();
          }, [fetchAuthoritativeCmsData]);"""
          if marker not in s: raise SystemExit('bootstrap marker not found')
          insert=marker+"""

          const [cmsSettingsLoaded, setCmsSettingsLoaded] = useState(false);
          const saveCmsSetting = useCallback(async (key: string, value: unknown) => {
            try {
              const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token');
              const response = await fetch(`/api/cms/settings/${encodeURIComponent(key)}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  ...(token ? { Authorization: `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ value })
              });
              if (!response.ok) throw new Error(`CMS setting ${key} returned HTTP ${response.status}`);
            } catch (error) {
              console.error(`[CMS] Failed to persist ${key}:`, error);
            }
          }, []);

          useEffect(() => {
            let cancelled = false;
            (async () => {
              try {
                const response = await fetch('/api/cms/settings');
                if (!response.ok) throw new Error(`CMS settings API returned HTTP ${response.status}`);
                const records = await response.json();
                const byKey = new Map((Array.isArray(records) ? records : []).map((item: any) => [item.setting_key, item.setting_value]));
                if (cancelled) return;
                const menu = byKey.get('navigation.menu');
                const footer = byKey.get('footer.settings');
                const announcementValue = byKey.get('announcement.settings');
                const popupValue = byKey.get('popup.settings');
                if (Array.isArray(menu)) setMenuItems(menu);
                if (footer && typeof footer === 'object') setFooterSettings(footer);
                if (announcementValue && typeof announcementValue === 'object') setAnnouncement(announcementValue);
                if (popupValue && typeof popupValue === 'object') setPopup(popupValue);
              } catch (error) {
                console.error('[CMS] Authoritative global settings bootstrap failed:', error);
              } finally {
                if (!cancelled) setCmsSettingsLoaded(true);
              }
            })();
            return () => { cancelled = true; };
          }, []);

          useEffect(() => {
            if (!cmsSettingsLoaded) return;
            const timer = window.setTimeout(() => {
              void saveCmsSetting('navigation.menu', menuItems);
              void saveCmsSetting('footer.settings', footerSettings);
              void saveCmsSetting('announcement.settings', announcement);
              void saveCmsSetting('popup.settings', popup);
            }, 700);
            return () => window.clearTimeout(timer);
          }, [cmsSettingsLoaded, menuItems, footerSettings, announcement, popup, saveCmsSetting]);"""
          s=s.replace(marker,insert,1)

          s=s.replace("    localStorage.setItem('cms_menu_items', JSON.stringify(menuItems));\n    localStorage.setItem('cms_footer_settings', JSON.stringify(footerSettings));\n    localStorage.setItem('cms_announcement_settings', JSON.stringify(announcement));\n    localStorage.setItem('cms_popup_settings', JSON.stringify(popup));\n",'',1)
          s=s.replace("  }, [websiteStatus, homepageSections, banners, webPages, menuItems, footerSettings, announcement, popup, homepageLayoutConfigs, promotions, seoSettings, mediaAssets, activityLogs, revisions]);", "  }, [websiteStatus, homepageSections, banners, webPages, homepageLayoutConfigs, promotions, seoSettings, mediaAssets, activityLogs, revisions]);",1)

          s=s.replace("if (userRole === 'customer') {", "if (!['owner', 'admin', 'manager'].includes(String(currentUser?.role || '').toLowerCase())) {",1)
          s=s.replace("{userRole === 'customer' ? (", "{!['owner', 'admin', 'manager'].includes(String(currentUser?.role || '').toLowerCase()) ? (",1)
          s=s.replace("                setUserRole('owner');\n                handleAddCmsActivityLog(\"Escalated permissions from CUSTOMER to OWNER\", \"System Sentry\");\n                alert(\"Simulated role upgraded back to OWNER. Full systems unlocked.\");", "                alert(\"Permission denied. Your server-authoritative role does not allow CMS access.\");",1)
          s=s.replace("  }, [currentUser, userRole]);", "  }, [currentUser]);",1)
          s=s.replace("if (userRole === 'staff') {", "if (String(currentUser?.role || '').toLowerCase() === 'staff') {",1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          ! grep -q "localStorage.getItem('cms_menu_items')" src/components/EnterpriseCmsManager.tsx
          ! grep -q "localStorage.getItem('cms_footer_settings')" src/components/EnterpriseCmsManager.tsx
          ! grep -q "localStorage.getItem('cms_announcement_settings')" src/components/EnterpriseCmsManager.tsx
          ! grep -q "localStorage.getItem('cms_popup_settings')" src/components/EnterpriseCmsManager.tsx
          grep -q "navigation.menu" src/components/EnterpriseCmsManager.tsx
          grep -q "footer.settings" src/components/EnterpriseCmsManager.tsx
          grep -q "announcement.settings" src/components/EnterpriseCmsManager.tsx
          grep -q "popup.settings" src/components/EnterpriseCmsManager.tsx
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseCmsManager.tsx
          git commit -m "fix(cms): connect menu footer announcement popup to authoritative settings"
          git push origin HEAD:audit/dashboard-sync-fix
          git rm .github/workflows/cms-four-settings-authoritative.yml
          git commit -m "chore: remove one-time cms settings workflow"
          git push origin HEAD:audit/dashboard-sync-fix
