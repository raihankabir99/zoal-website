name: One-time AI provider routing patch

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(ai): route AI gateway through enabled third-party providers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch AI gateway with guarded provider routing
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/ai_gateway.ts')
          s = p.read_text()

          old = "type AIProviderName = 'gemini';"
          new = "type AIProviderName = 'gemini' | 'openai' | 'groq';"
          if old not in s:
              raise SystemExit('provider type anchor not found')
          s = s.replace(old, new, 1)

          anchor = "function decryptSecret(encrypted: string, iv: string, authTag: string) {"
          start = s.index(anchor)
          end = s.index("\n}\n\nasync function loadGeminiApiKey", start) + 2
          decrypt_block = s[start:end]
          if 'decryptSecret' not in decrypt_block:
              raise SystemExit('decrypt block validation failed')

          insert = '''\n\nasync function loadThirdPartyAIProvider(requested?: AIProviderName) {\n  const client = getPgClient();\n  await client.connect();\n  try {\n    const params: any[] = [];\n    let where = `provider IN ('openai','groq','gemini') AND status = 'active'`;\n    if (requested && requested !== 'gemini') {\n      where = `provider = $1 AND status = 'active'`;\n      params.push(requested);\n    }\n    const result = await client.query(\n      `SELECT provider, encrypted_secret, iv, auth_tag\n       FROM public.zoal_third_party_integrations\n       WHERE ${where}\n       ORDER BY COALESCE(last_verified_at, updated_at) DESC\n       LIMIT 1`,\n      params\n    );\n    const row = result.rows[0];\n    if (!row) return null;\n    return {\n      provider: row.provider as AIProviderName,\n      apiKey: decryptSecret(row.encrypted_secret, row.iv, row.auth_tag)\n    };\n  } finally {\n    await client.end();\n  }\n}\n'''
          if 'async function loadThirdPartyAIProvider' not in s:
              s = s[:end] + insert + s[end:]

          old_validate = '''function validateAIRequest(input: AIRequest): Required<AIRequest> {\n  if (input.provider !== 'gemini') throw new Error('Unsupported AI provider');\n  if (typeof input.prompt !== 'string' || !input.prompt.trim()) throw new Error('Prompt is required');\n  if (input.prompt.length > MAX_PROMPT_CHARS) throw new Error('Prompt exceeds configured size limit');\n  const maxOutputTokens = input.maxOutputTokens ?? MAX_OUTPUT_TOKENS;\n  if (!Number.isInteger(maxOutputTokens) || maxOutputTokens < 1 || maxOutputTokens > MAX_OUTPUT_TOKENS) {\n    throw new Error('Invalid maxOutputTokens');\n  }\n  return {\n    provider: 'gemini',\n    model: input.model || DEFAULT_MODEL,\n    prompt: input.prompt,\n    maxOutputTokens\n  };\n}'''
          new_validate = '''function validateAIRequest(input: AIRequest): Required<AIRequest> {\n  if (!['gemini','openai','groq'].includes(input.provider)) throw new Error('Unsupported AI provider');\n  if (typeof input.prompt !== 'string' || !input.prompt.trim()) throw new Error('Prompt is required');\n  if (input.prompt.length > MAX_PROMPT_CHARS) throw new Error('Prompt exceeds configured size limit');\n  const maxOutputTokens = input.maxOutputTokens ?? MAX_OUTPUT_TOKENS;\n  if (!Number.isInteger(maxOutputTokens) || maxOutputTokens < 1 || maxOutputTokens > MAX_OUTPUT_TOKENS) {\n    throw new Error('Invalid maxOutputTokens');\n  }\n  const model = input.model || (input.provider === 'openai' ? (process.env.OPENAI_MODEL || 'gpt-5.6-luna') : input.provider === 'groq' ? (process.env.GROQ_MODEL || 'llama-3.3-70b-versatile') : DEFAULT_MODEL);\n  return { provider: input.provider, model, prompt: input.prompt, maxOutputTokens };\n}'''
          if old_validate not in s:
              raise SystemExit('validateAIRequest anchor not found')
          s = s.replace(old_validate, new_validate, 1)

          start = s.index('async function generateWithGemini')
          end = s.index('\n\nasync function executeAI', start)
          new_generate = '''async function generateWithProvider(input: Required<AIRequest>, apiKey: string) {\n  const controller = new AbortController();\n  const timeout = setTimeout(() => controller.abort(), PROVIDER_TIMEOUT_MS);\n  try {\n    if (input.provider === 'gemini') {\n      const ai = new GoogleGenAI({ apiKey });\n      const response = await ai.models.generateContent({\n        model: input.model,\n        contents: input.prompt,\n        config: { maxOutputTokens: input.maxOutputTokens, abortSignal: controller.signal } as any\n      });\n      return response.text || '';\n    }\n\n    const base = input.provider === 'openai' ? 'https://api.openai.com/v1/responses' : 'https://api.groq.com/openai/v1/chat/completions';\n    const body = input.provider === 'openai'\n      ? { model: input.model, input: input.prompt, max_output_tokens: input.maxOutputTokens }\n      : { model: input.model, messages: [{ role: 'user', content: input.prompt }], max_completion_tokens: input.maxOutputTokens };\n    const response = await fetch(base, {\n      method: 'POST',\n      headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },\n      body: JSON.stringify(body),\n      signal: controller.signal\n    });\n    const payload: any = await response.json().catch(() => ({}));\n    if (!response.ok) throw new Error(`${input.provider} generation failed with HTTP ${response.status}`);\n    if (input.provider === 'openai') {\n      const text = payload?.output_text || payload?.output?.flatMap((x: any) => x?.content || []).map((x: any) => x?.text || '').join('') || '';\n      return String(text);\n    }\n    return String(payload?.choices?.[0]?.message?.content || '');\n  } finally {\n    clearTimeout(timeout);\n  }\n}'''
          s = s[:start] + new_generate + s[end:]

          old_execute = '''async function executeAI(req: Request, input: AIRequest) {\n  const normalized = validateAIRequest(input);\n  const userId = getUserId(req);\n  const requestId = crypto.randomUUID();\n  const acquired = await acquireLease(userId, requestId, normalized.provider);\n  if (!acquired) throw Object.assign(new Error('AI concurrency limit reached'), { statusCode: 429 });\n  try {\n    return await generateWithGemini(normalized);\n  } finally {\n    await releaseLease(requestId);\n  }\n}'''
          new_execute = '''async function executeAI(req: Request, input: AIRequest) {\n  const normalized = validateAIRequest(input);\n  const configured = await loadThirdPartyAIProvider(normalized.provider);\n  let provider = normalized.provider;\n  let apiKey: string;\n\n  if (configured) {\n    provider = configured.provider;\n    apiKey = configured.apiKey;\n  } else if (normalized.provider === 'gemini') {\n    apiKey = await loadGeminiApiKey();\n  } else {\n    throw new Error(`${normalized.provider} provider is not enabled in 3rd Party Integrations`);\n  }\n\n  const effective = { ...normalized, provider };\n  const userId = getUserId(req);\n  const requestId = crypto.randomUUID();\n  const acquired = await acquireLease(userId, requestId, effective.provider);\n  if (!acquired) throw Object.assign(new Error('AI concurrency limit reached'), { statusCode: 429 });\n  try {\n    const text = await generateWithProvider(effective, apiKey);\n    return { provider: effective.provider, text };\n  } finally {\n    await releaseLease(requestId);\n  }\n}'''
          if old_execute not in s:
              raise SystemExit('executeAI anchor not found')
          s = s.replace(old_execute, new_execute, 1)

          s = s.replace("const result = await executeAI(req, req.body as AIRequest);", "const result = await executeAI(req, req.body as AIRequest);", 1)
          s = s.replace("return res.json({ ok: true, provider: 'gemini', text: result });", "return res.json({ ok: true, provider: result.provider, text: result.text });", 1)
          s = s.replace("? { ok: true, text: result.value }", "? { ok: true, provider: result.value.provider, text: result.value.text }", 1)

          p.write_text(s)
          print('AI provider routing patch applied')

      - name: Typecheck/build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/ai_gateway.ts .github/workflows/one-time-ai-provider-routing.yml
          git commit -m "fix(ai): route AI gateway through enabled third-party providers"
          git push origin audit/dashboard-sync-fix
