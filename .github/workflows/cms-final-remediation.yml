name: CMS final remediation

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply CMS source hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/EnterpriseCmsManager.tsx')
          s = p.read_text()

          # Remove client-side role simulation state.
          s = s.replace("  const [userRole, setUserRole] = useState<'owner' | 'admin' | 'staff' | 'customer'>(() => {\n    return (currentUser?.role as any) || 'owner';\n  });\n", "")

          # Make local activity metadata server-role-derived only.
          s = s.replace("${currentUser?.name || 'Support Office'} (${userRole.toUpperCase()})", "${currentUser?.name || 'Support Office'} (${String(currentUser?.role || 'unknown').toUpperCase()})")
          s = s.replace("`${currentUser?.name || 'Support Office'} (${userRole.toUpperCase()})`", "`${currentUser?.name || 'Support Office'} (${String(currentUser?.role || 'unknown').toUpperCase()})`")
          s = s.replace("${currentUser?.name || 'Support Office'} (${userRole.toUpperCase()})", "${currentUser?.name || 'Support Office'} (${String(currentUser?.role || 'unknown').toUpperCase()})")

          # Remove the interactive role-swapper UI and replace it with an indicator.
          start = s.find("          {/* 2. Interactive Role Swapper (RBAC simulation) */}")
          if start != -1:
              end_marker = "\n\n          {/* 3. English/Arabic RTL Switcher */}"
              end = s.find(end_marker, start)
              if end == -1:
                  raise SystemExit('role UI end marker not found')
              replacement = '''          {/* 2. Server-authoritative role indicator */}\n          <div className="flex items-center gap-1.5 bg-zinc-900 border border-white/5 py-1 px-2.5 rounded-xs">\n            <Shield className="w-3.5 h-3.5 text-gold-pure" />\n            <span className="text-[9.5px] uppercase tracking-wider font-mono text-zinc-300">\n              Role: {String(currentUser?.role || 'unknown').toUpperCase()}\n            </span>\n          </div>'''
              s = s[:start] + replacement + s[end:]

          # Remove client-only customer access shield; backend RBAC remains authoritative.
          guard_start = s.find("        {/* Access Denied Shield Guard if role is customer */}")
          if guard_start != -1:
              guard_end = s.find("        {/* 1. CMS DASHBOARD SUBTAB */}", guard_start)
              if guard_end == -1:
                  raise SystemExit('access guard end marker not found')
              s = s[:guard_start] + s[guard_end:]

          # Remove role-based deployment/rollback client checks.
          old = '''              if (userRole === 'customer') {\n                alert("Permission Denied: Customer accounts are blocked from deploying CMS changes.");\n                return;\n              }\n'''
          s = s.replace(old, '')
          s = s.replace("                            if (userRole === 'staff') {\n                              alert(\"Permissions Guard: Staff role is restricted from restoring rollbacks.\");\n                              return;\n                            }\n", "")

          # Remove synthetic localStorage as the authoritative CMS source for core CMS datasets.
          s = s.replace("    const raw = localStorage.getItem('cms_homepage_sections');\n    if (raw) return JSON.parse(raw);\n", "")
          s = s.replace("    const raw = localStorage.getItem('cms_banners');\n    if (raw) return JSON.parse(raw);\n", "")
          s = s.replace("    const raw = localStorage.getItem('cms_web_pages');\n    if (raw) return JSON.parse(raw);\n", "")

          # Add a safe authoritative read on mount. It intentionally consumes only public/published CMS data.
          anchor = "  // --- EDITORIAL LOOKBOOK STATE & HANDLERS ---"
          if "fetchAuthoritativeCmsData" not in s:
              insert = r'''  // --- AUTHORITATIVE CMS DATA SYNC ---\n  const fetchAuthoritativeCmsData = useCallback(async () => {\n    try {\n      const response = await fetch('/api/cms');\n      if (!response.ok) throw new Error(`CMS API returned HTTP ${response.status}`);\n      const data = await response.json();\n\n      if (Array.isArray(data.sections)) {\n        const mappedSections: HomepageSection[] = data.sections.map((section: any, index: number) => ({\n          id: String(section.section_key ?? section.id ?? `section-${index + 1}`),\n          name: String(section.title ?? section.section_type ?? section.section_key ?? `Section ${index + 1}`),\n          enabled: section.is_active ?? section.enabled ?? true,\n          order: Number(section.display_order ?? section.order_index ?? index + 1),\n          publishAt: section.schedule_start ?? '',\n          expireAt: section.schedule_end ?? ''\n        }));\n        setHomepageSections(mappedSections.sort((a, b) => a.order - b.order));\n      }\n\n      if (Array.isArray(data.banners)) {\n        setBanners(data.banners.map((banner: any) => ({\n          id: String(banner.id),\n          type: 'homepage',\n          title: String(banner.title ?? ''),\n          subtitle: String(banner.subtitle ?? ''),\n          description: '',\n          buttonText: '',\n          buttonLink: String(banner.link_url ?? ''),\n          bgImage: String(banner.image_url ?? ''),\n          mobileImage: String(banner.image_url ?? ''),\n          priority: 0,\n          scheduleStart: '',\n          scheduleEnd: '',\n          status: banner.is_active ? 'published' : 'archived',\n          animation: 'fade'\n        })) as Banner[]);\n      }\n\n      if (Array.isArray(data.pages)) {\n        const mappedPages: WebPage[] = data.pages.map((page: any) => {\n          const content = page.content_json && typeof page.content_json === 'object'\n            ? String(page.content_json.content ?? page.content_json.body ?? '')\n            : String(page.content_json ?? '');\n          return {\n            id: String(page.id),\n            key: String(page.slug ?? page.id),\n            title: String(page.title ?? ''),\n            content,\n            images: Array.isArray(page.content_json?.images) ? page.content_json.images : [],\n            videos: Array.isArray(page.content_json?.videos) ? page.content_json.videos : [],\n            seoTitle: String(page.content_json?.seo_title ?? ''),\n            seoDesc: String(page.content_json?.seo_description ?? ''),\n            status: page.published ? 'published' : 'draft',\n            lastModified: String(page.updated_at ?? page.created_at ?? ''),\n            revisionHistory: []\n          };\n        });\n        setWebPages(prev => {\n          const legal = prev.filter(page => page.isLegalDoc);\n          return [...mappedPages, ...legal];\n        });\n      }\n    } catch (error) {\n      console.error('[CMS] Authoritative data sync failed:', error);\n    }\n  }, []);\n\n  useEffect(() => {\n    void fetchAuthoritativeCmsData();\n  }, [fetchAuthoritativeCmsData]);\n\n'''
              if anchor not in s:
                  raise SystemExit('CMS insertion anchor not found')
              s = s.replace(anchor, insert + anchor, 1)

          # Stop persisting core authoritative datasets back into localStorage.
          for line in [
              "    localStorage.setItem('cms_homepage_sections', JSON.stringify(homepageSections));\n",
              "    localStorage.setItem('cms_banners', JSON.stringify(banners));\n",
              "    localStorage.setItem('cms_web_pages', JSON.stringify(nonLegalPages));\n"
          ]:
              s = s.replace(line, '')

          p.write_text(s)
          PY

      - name: Validate source
        run: |
          grep -q "Server-authoritative role indicator" src/components/EnterpriseCmsManager.tsx
          grep -q "fetchAuthoritativeCmsData" src/components/EnterpriseCmsManager.tsx
          ! grep -q "Interactive Role Swapper (RBAC simulation)" src/components/EnterpriseCmsManager.tsx
          ! grep -q "const \[userRole" src/components/EnterpriseCmsManager.tsx
          git diff --check
          npm run build

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseCmsManager.tsx
          git commit -m "fix(cms): remove client role simulation and local CMS source of truth [cms-final]"
          git push
