name: One-time KPI manager access fix

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(kpi): allow manager KPI access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 1

      - name: Patch exact KPI route authorization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.ts')
          s = p.read_text()
          old = """// KPI Engine Routes
app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.getKpiData);
app.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.setKpiTarget);
app.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.deleteKpiTarget);"""
          new = """// KPI Engine Routes
// KPI access is aligned with the Admin Dashboard manager access policy.
app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.getKpiData);
app.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.setKpiTarget);
app.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.deleteKpiTarget);"""
          if old not in s:
              raise SystemExit('Expected KPI route block not found; refusing to modify app.ts')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify patch
        run: |
          grep -F "app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin', 'manager'])" app.ts
          grep -F "app.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin', 'manager'])" app.ts
          grep -F "app.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin', 'manager'])" app.ts

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/kpi-manager-access-fix.yml
          git add app.ts .github/workflows/kpi-manager-access-fix.yml
          git commit -m 'fix(kpi): allow manager KPI access'
          git push origin audit/dashboard-sync-fix

# Guarded, exact-match remediation; no other source files are changed.