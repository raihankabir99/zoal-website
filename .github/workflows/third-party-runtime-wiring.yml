name: One-time safe third-party runtime wiring

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[third-party-runtime-wiring]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Apply guarded surgical patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'ABORT: {path}: expected exactly 1 match, found {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('app.ts', "app.post('/api/admin/third-party-integrations/:id/test', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.testThirdPartyIntegration);\n", "app.post('/api/admin/third-party-integrations/:id/test', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.testThirdPartyIntegration);\n\n// Compatibility aliases for the current AdminDashboard client contract.\napp.get('/api/admin/third-party', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.listThirdPartyIntegrations);\napp.post('/api/admin/third-party', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.createThirdPartyIntegration);\napp.patch('/api/admin/third-party/:id', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.updateThirdPartyIntegration);\napp.delete('/api/admin/third-party/:id', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.deleteThirdPartyIntegration);\napp.post('/api/admin/third-party/:id/test', authenticateRequest, requireRole(['owner', 'admin']), thirdPartyIntegrationsModule.testThirdPartyIntegration);\n")

          replace_once('server/third_party_integrations.ts', "function decryptSecret(encrypted: string, iv: string, authTag: string) {\n  const decipher = crypto.createDecipheriv('aes-256-gcm', getMasterKey(), Buffer.from(iv, 'base64'));\n  decipher.setAuthTag(Buffer.from(authTag, 'base64'));\n  return Buffer.concat([decipher.update(Buffer.from(encrypted, 'base64')), decipher.final()]).toString('utf8');\n}\n", "function decryptSecret(encrypted: string, iv: string, authTag: string) {\n  const decipher = crypto.createDecipheriv('aes-256-gcm', getMasterKey(), Buffer.from(iv, 'base64'));\n  decipher.setAuthTag(Buffer.from(authTag, 'base64'));\n  return Buffer.concat([decipher.update(Buffer.from(encrypted, 'base64')), decipher.final()]).toString('utf8');\n}\n\nfunction parseMetricoolCredential(raw: string) {\n  try {\n    const parsed = JSON.parse(raw);\n    if (parsed && typeof parsed === 'object' && typeof parsed.token === 'string') return { token: parsed.token, userId: String(parsed.userId || ''), blogId: String(parsed.blogId || '') };\n  } catch {}\n  return { token: raw, userId: '', blogId: '' };\n}\n\nfunction isMetricoolId(value: string) { return /^\\d+$/.test(value); }\n")

          replace_once('server/third_party_integrations.ts', "    const secret = String(req.body?.secret || '');\n    const category = String(req.body?.category || 'Other').trim().slice(0, 80) || 'Other';\n    if (!displayName || displayName.length > 120) return res.status(400).json({ ok: false, error: 'A valid display name is required' });\n    if (secret.length < 8 || secret.length > 4096) return res.status(400).json({ ok: false, error: 'Credential length is invalid' });\n    const encrypted = encryptSecret(secret);", "    const secret = String(req.body?.secret || '');\n    const category = String(req.body?.category || 'Other').trim().slice(0, 80) || 'Other';\n    const userId = String(req.body?.userId || '').trim();\n    const blogId = String(req.body?.blogId || '').trim();\n    if (!displayName || displayName.length > 120) return res.status(400).json({ ok: false, error: 'A valid display name is required' });\n    if (secret.length < 8 || secret.length > 4096) return res.status(400).json({ ok: false, error: 'Credential length is invalid' });\n    if (provider === 'metricool' && (!isMetricoolId(userId) || !isMetricoolId(blogId))) return res.status(400).json({ ok: false, error: 'Metricool User ID and Blog ID are required numeric identifiers' });\n    const credentialPayload = provider === 'metricool' ? JSON.stringify({ token: secret, userId, blogId }) : secret;\n    const encrypted = encryptSecret(credentialPayload);")

          replace_once('server/third_party_integrations.ts', "    const status = req.body?.status === undefined ? undefined : String(req.body.status).toLowerCase();\n    const secret = req.body?.secret === undefined ? undefined : String(req.body.secret);", "    const status = req.body?.status === undefined ? undefined : String(req.body.status).toLowerCase();\n    const secret = req.body?.secret === undefined ? undefined : String(req.body.secret);\n    const userId = req.body?.userId === undefined ? undefined : String(req.body.userId).trim();\n    const blogId = req.body?.blogId === undefined ? undefined : String(req.body.blogId).trim();")

          replace_once('server/third_party_integrations.ts', "    if (secret !== undefined && (secret.length < 8 || secret.length > 4096)) return res.status(400).json({ ok: false, error: 'Credential length is invalid' });\n    const sets: string[] = ['updated_by = $2'];", "    if (secret !== undefined && (secret.length < 8 || secret.length > 4096)) return res.status(400).json({ ok: false, error: 'Credential length is invalid' });\n    if ((userId !== undefined || blogId !== undefined) && (!userId || !blogId || !isMetricoolId(userId) || !isMetricoolId(blogId))) return res.status(400).json({ ok: false, error: 'Metricool User ID and Blog ID must both be numeric identifiers' });\n    if ((userId !== undefined || blogId !== undefined) && secret === undefined) return res.status(400).json({ ok: false, error: 'Metricool credential token must be re-entered when changing User ID or Blog ID' });\n    const sets: string[] = ['updated_by = $2'];")

          replace_once('server/third_party_integrations.ts', "    if (secret !== undefined) {\n      const encrypted = encryptSecret(secret);", "    if (secret !== undefined) {\n      const credentialPayload = userId !== undefined && blogId !== undefined ? JSON.stringify({ token: secret, userId, blogId }) : secret;\n      const encrypted = encryptSecret(credentialPayload);")

          old_test = """      const result = await client.query(`select id,provider,encrypted_secret,iv,auth_tag,status from public.zoal_third_party_integrations where id = $1`, [id]);
      const row = result.rows[0];
      if (!row) return res.status(404).json({ ok: false, error: 'Integration not found' });
      if (row.provider !== 'metricool') return res.status(400).json({ ok: false, error: 'No provider adapter is available for this integration yet' });
      decryptSecret(row.encrypted_secret, row.iv, row.auth_tag);
      if (row.status === 'active') {
        await client.query(`update public.zoal_third_party_integrations set status = 'inactive', last_error = 'Provider API adapter has not completed a live connectivity test' where id = $1`, [id]);
      }
      await audit(req, 'THIRD_PARTY_INTEGRATION_CREDENTIAL_CHECK', id, { provider: row.provider, adapter: 'credential-integrity', apiCalled: false });
      return res.json({
        ok: true,
        verified: false,
        mode: 'credential-integrity',
        active: false,
        message: 'Credential encryption integrity verified. No provider API call was made, so this integration remains inactive.'
      });"""
          new_test = """      const result = await client.query(`select id,provider,encrypted_secret,iv,auth_tag,status from public.zoal_third_party_integrations where id = $1`, [id]);
      const row = result.rows[0];
      if (!row) return res.status(404).json({ ok: false, error: 'Integration not found' });
      if (row.provider !== 'metricool') return res.status(400).json({ ok: false, error: 'No provider adapter is available for this integration yet' });
      const credential = parseMetricoolCredential(decryptSecret(row.encrypted_secret, row.iv, row.auth_tag));
      if (!credential.userId || !credential.blogId || !isMetricoolId(credential.userId) || !isMetricoolId(credential.blogId)) {
        await client.query(`update public.zoal_third_party_integrations set status = 'inactive', last_error = 'Metricool User ID and Blog ID are required for live API verification', last_verified_at = null where id = $1`, [id]);
        return res.status(400).json({ ok: false, verified: false, active: false, error: 'Metricool User ID and Blog ID are required for live API verification' });
      }
      const target = new URL('https://app.metricool.com/api/admin/simpleProfiles');
      target.searchParams.set('userId', credential.userId);
      target.searchParams.set('blogId', credential.blogId);
      const providerResponse = await fetch(target, { method: 'GET', headers: { 'X-Mc-Auth': credential.token, 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(10000) });
      if (!providerResponse.ok) {
        const providerStatus = providerResponse.status;
        await client.query(`update public.zoal_third_party_integrations set status = 'error', last_error = $2, last_verified_at = null where id = $1`, [id, `Metricool API verification failed with HTTP ${providerStatus}`]);
        await audit(req, 'THIRD_PARTY_INTEGRATION_LIVE_TEST_FAILED', id, { provider: row.provider, adapter: 'metricool', apiCalled: true, httpStatus: providerStatus });
        return res.status(502).json({ ok: false, verified: false, active: false, error: `Metricool API verification failed (HTTP ${providerStatus})` });
      }
      await providerResponse.arrayBuffer();
      await client.query(`update public.zoal_third_party_integrations set status = 'active', last_error = null, last_verified_at = now() where id = $1`, [id]);
      await audit(req, 'THIRD_PARTY_INTEGRATION_LIVE_TEST_SUCCESS', id, { provider: row.provider, adapter: 'metricool', apiCalled: true, httpStatus: providerResponse.status, activated: true });
      return res.json({ ok: true, verified: true, mode: 'live-api', active: true, message: 'Metricool API connectivity verified successfully. Integration is now active.' });"""
          replace_once('server/third_party_integrations.ts', old_test, new_test)

          replace_once('src/components/AdminDashboard.tsx', "    webhookSecret: ''\n  });", "    webhookSecret: '',\n    metricoolUserId: '',\n    metricoolBlogId: ''\n  });")

          replace_once('src/components/AdminDashboard.tsx', "      secret: integrationForm.apiKey || integrationForm.accessToken || integrationForm.clientSecret || integrationForm.webhookSecret\n    };\n    if (!body.secret) throw new Error('A credential is required.');\n    const response = editingIntegration\n      ? await fetch(`/api/admin/third-party/${editingIntegration.id}`, { method: 'PATCH', headers, body: JSON.stringify({ displayName: body.displayName, category: body.category, status: activate ? 'active' : 'inactive', secret: body.secret }) })\n      : await fetch('/api/admin/third-party', { method: 'POST', headers, body: JSON.stringify(body) });", "      secret: integrationForm.apiKey || integrationForm.accessToken || integrationForm.clientSecret || integrationForm.webhookSecret,\n      userId: integrationForm.provider === 'metricool' ? String(integrationForm.metricoolUserId || '').trim() : undefined,\n      blogId: integrationForm.provider === 'metricool' ? String(integrationForm.metricoolBlogId || '').trim() : undefined\n    };\n    if (!body.secret) throw new Error('A credential is required.');\n    if (integrationForm.provider === 'metricool' && (!body.userId || !body.blogId)) throw new Error('Metricool User ID and Blog ID are required.');\n    const response = editingIntegration\n      ? await fetch(`/api/admin/third-party/${editingIntegration.id}`, { method: 'PATCH', headers, body: JSON.stringify({ displayName: body.displayName, category: body.category, secret: body.secret, userId: body.userId, blogId: body.blogId }) })\n      : await fetch('/api/admin/third-party', { method: 'POST', headers, body: JSON.stringify(body) });")

          replace_once('src/components/AdminDashboard.tsx', "    setIntegrationFeedback(activate ? `Published \\\"${integrationForm.name}\\\" securely.` : `Saved \\\"${integrationForm.name}\\\" securely as inactive.`);\n  };", "    setIntegrationFeedback(`Saved \\\"${integrationForm.name}\\\" securely as inactive. Run Test Connection for live provider verification.`);\n  };")

          replace_once('src/components/AdminDashboard.tsx', "  const updateThirdPartyStatus = async (id: string, status: 'active' | 'inactive') => {\n    const headers = await getThirdPartyAuthHeaders();\n    const response = await fetch(`/api/admin/third-party/${id}`, { method: 'PATCH', headers, body: JSON.stringify({ status }) });\n    const payload = await response.json();\n    if (!response.ok) throw new Error(payload?.error || 'Unable to update integration status.');\n    await loadThirdPartyIntegrations();\n    setIntegrationFeedback(status === 'active' ? 'Integration enabled.' : 'Integration disabled.');\n  };", "  const updateThirdPartyStatus = async (id: string, status: 'active' | 'inactive') => {\n    if (status === 'active') { await testThirdPartyIntegration(id); return; }\n    const headers = await getThirdPartyAuthHeaders();\n    const response = await fetch(`/api/admin/third-party/${id}`, { method: 'PATCH', headers, body: JSON.stringify({ status: 'inactive' }) });\n    const payload = await response.json();\n    if (!response.ok) throw new Error(payload?.error || 'Unable to disable integration.');\n    await loadThirdPartyIntegrations();\n    setIntegrationFeedback('Integration disabled.');\n  };")

          s = Path('src/components/AdminDashboard.tsx').read_text(encoding='utf-8')
          api_key_block = '''                              {integrationForm.authType === 'API Key' && (
                                <div className="space-y-1.5 md:col-span-2">
                                  <label className="text-zinc-300 text-xs block font-mono font-semibold">API Key</label>
                                  <input
                                    type="password"
                                    value={integrationForm.apiKey}
                                    onChange={(e) => setIntegrationForm({ ...integrationForm, apiKey: e.target.value })}
                                    placeholder="••••••••••••••••••••••••••••••••"
                                    className="w-full bg-black border border-white/15 text-white p-2.5 text-xs outline-none focus:border-gold-pure focus:ring-1 focus:ring-gold-pure font-mono rounded-xs"
                                  />
                                </div>
                              )}'''
          if s.count(api_key_block) != 1: raise SystemExit(f'ABORT: API Key form block expected 1, found {s.count(api_key_block)}')
          metricool_block = api_key_block + '''

                              {integrationForm.provider === 'metricool' && (
                                <>
                                  <div className="space-y-1.5">
                                    <label className="text-zinc-300 text-xs block font-mono font-semibold">Metricool User ID *</label>
                                    <input type="text" inputMode="numeric" value={integrationForm.metricoolUserId} onChange={(e) => setIntegrationForm({ ...integrationForm, metricoolUserId: e.target.value.replace(/\\D/g, '') })} placeholder="e.g. 1234567" className="w-full bg-black border border-white/15 text-white p-2.5 text-xs outline-none focus:border-gold-pure font-mono rounded-xs" />
                                  </div>
                                  <div className="space-y-1.5">
                                    <label className="text-zinc-300 text-xs block font-mono font-semibold">Metricool Blog ID *</label>
                                    <input type="text" inputMode="numeric" value={integrationForm.metricoolBlogId} onChange={(e) => setIntegrationForm({ ...integrationForm, metricoolBlogId: e.target.value.replace(/\\D/g, '') })} placeholder="e.g. 7654321" className="w-full bg-black border border-white/15 text-white p-2.5 text-xs outline-none focus:border-gold-pure font-mono rounded-xs" />
                                  </div>
                                </>
                              )}'''
          Path('src/components/AdminDashboard.tsx').write_text(s.replace(api_key_block, metricool_block, 1), encoding='utf-8')

          replace_once('src/components/AdminDashboard.tsx', 'await saveThirdPartyIntegration(true);', 'await saveThirdPartyIntegration(false);')
          print('Guarded third-party runtime patch applied.')

      - name: Commit surgical patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/third-party-runtime-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.ts server/third_party_integrations.ts src/components/AdminDashboard.tsx .github/workflows/third-party-runtime-wiring.yml
          git commit -m "fix(3rd-party): wire live Metricool verification and runtime routes [third-party-runtime-wiring]"
          git push origin audit/dashboard-sync-fix
