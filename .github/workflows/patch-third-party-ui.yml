name: Patch Third Party UI Truthfulness
on:
  push:
    branches: [audit/dashboard-sync-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch misleading UI text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminDashboard.tsx')
          s = p.read_text()
          replacements = {
            'UI Preview • Server Integration API Not Connected. Integrations configured here exist in local session state only.': 'Production integration registry • Server-backed encrypted credentials with Owner/Admin access control.',
            'Federated ecosystem configurations & API mappings (UI Preview)': 'Federated ecosystem configurations & encrypted server-side credential mappings',
            'View: ${item.name} is configured via provider ${item.provider}. (UI Preview Mode)': 'View: ${item.name} is configured via provider ${item.provider}.',
            'UI-only local activity preview — server audit ledger not yet connected': 'Server audit events are written to the production activity ledger.',
            'No local activity logged yet in this session.': 'No integration activity recorded yet.',
            'Configure local integration drafts using the button below.': 'Add a supported integration credential below. It is encrypted server-side and remains inactive until deliberately enabled.',
            'Configure federated API nodes and transport credentials (UI Preview)': 'Configure a supported integration and store its credential securely on the server.',
            'Production credentials will be stored securely on the server in the backend implementation phase. Entering an API key is a configuration draft and does NOT automatically activate live services. Activation must be a deliberate lifecycle step.': 'Credentials are encrypted server-side. Saving keeps the integration inactive; Publish/Enable is the deliberate activation step.',
          }
          for old, new in replacements.items():
              if old not in s:
                  print(f'WARN missing text: {old[:80]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          npm ci --ignore-scripts
          npm run build
          rm -f .github/workflows/patch-third-party-ui.yml
          git add src/components/AdminDashboard.tsx
          git add -u .github/workflows/patch-third-party-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(3rd-party): remove stale UI preview messaging'
          git push
