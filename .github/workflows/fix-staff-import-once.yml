name: One-time StaffDashboard import fix

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0
      - name: Apply exact import correction
        shell: bash
        run: |
          set -euo pipefail
          file="src/components/StaffDashboard.tsx"
          grep -Fq "import supabaseClient from '../lib/supabaseClient';" "$file"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/StaffDashboard.tsx')
          s = p.read_text()
          old = "import supabaseClient from '../lib/supabaseClient';"
          new = "import { supabaseClient } from '../lib/supabaseClient';"
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one legacy Supabase import')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          grep -Fq "import { supabaseClient } from '../lib/supabaseClient';" "$file"
      - name: Build verification
        run: npm ci && npm run build
      - name: Commit exact fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-staff-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StaffDashboard.tsx .github/workflows/fix-staff-import-once.yml
          git commit -m "fix(staff): correct Supabase client import after build verification"
          git push origin audit/dashboard-sync-fix
