name: Staff Order Persistence Exact Guard
on:
  push:
    branches: [audit/dashboard-sync-fix]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(staff): bind order operations to authoritative API') && !contains(github.event.head_commit.message, 'chore(audit): remove staff order persistence guard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Patch only verified staff order handlers
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/components/EnterpriseOrderManagement.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          
          # Replace the hardcoded assignment roster with authoritative API-backed state.
          staff_pat = re.compile(r"  // Mock staff list for assignment\n  const STAFF_LIST = \[.*?\n  \];", re.S)
          staff_repl = '''  // Authoritative staff roster for assignment
  const [staffList, setStaffList] = useState<Array<{ id: string; name: string; email: string }>>([]);
  useEffect(() => {
    let cancelled = false;
    const loadStaff = async () => {
      try {
        const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token');
        if (!token) return;
        const response = await fetch('/api/staff', {
          headers: { Authorization: `Bearer ${token}` },
          cache: 'no-store',
        });
        if (!response.ok) throw new Error(`Staff API ${response.status}`);
        const result = await response.json();
        const users = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];
        if (!cancelled) {
          setStaffList(users.map((user: any) => ({
            id: String(user.id),
            name: [user.first_name, user.last_name].filter(Boolean).join(' ') || user.email || String(user.id),
            email: user.email || '',
          })));
        }
      } catch (error) {
        console.error('[EnterpriseOrderManagement] Failed to load staff roster', error);
      }
    };
    loadStaff();
    return () => { cancelled = true; };
  }, []);

  const getStaffAuthToken = () =>
    localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token');

  const persistOrderOperation = async (payload: Record<string, unknown>) => {
    const token = getStaffAuthToken();
    if (!token) throw new Error('Authenticated staff session is required.');
    const response = await fetch('/api/staff', {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(payload),
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result?.error || `Staff order operation failed (${response.status})`);
    }
    return result?.data || result?.order || result;
  };'''
          if not staff_pat.search(s):
            raise SystemExit('ABORT: exact Mock staff list marker not found')
          s = staff_pat.sub(staff_repl, s, count=1)
          
          status_pat = re.compile(r"  // Perform status update & timeline creation\n  const handleStatusTransition = \(orderId: string, nextStatus: Order\['status'\], noteText\?: string\) => \{.*?\n  \};\n\n  // Staff Assignment", re.S)
          status_repl = '''  // Perform status update & timeline creation
  const handleStatusTransition = async (orderId: string, nextStatus: Order['status'], noteText?: string) => {
    const orderToUpdate = orders.find(o => o.id === orderId);
    if (!orderToUpdate) return;
    const validTransitions = getValidTransitions(orderToUpdate.status);
    const isAdminOverride = hasRole('admin') || hasRole('owner') || hasRole('manager');
    if (!isAdminOverride && !validTransitions.includes(nextStatus)) {
      alert(`Invalid status transition: ${orderToUpdate.status} → ${nextStatus}`);
      return;
    }
    try {
      const updated = await persistOrderOperation({
        orderId,
        status: nextStatus,
        staffNotes: noteText || undefined,
      });
      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...(updated || {}), status: updated?.status || nextStatus } : o));
      if (selectedOrder?.id === orderId) {
        setSelectedOrder(prev => prev ? { ...prev, ...(updated || {}), status: updated?.status || nextStatus } : prev);
      }
    } catch (error: any) {
      console.error('[EnterpriseOrderManagement] Status persistence failed', error);
      alert(error?.message || 'Unable to persist order status. No local-only change was applied.');
    }
  };

  // Staff Assignment'''
          if not status_pat.search(s):
            raise SystemExit('ABORT: exact status handler marker not found')
          s = status_pat.sub(status_repl, s, count=1)
          
          assign_pat = re.compile(r"  // Staff Assignment\n  const handleAssignStaff = \(orderId: string, staffName: string\) => \{.*?\n  \};\n\n  // Notes Updates", re.S)
          assign_repl = '''  // Staff Assignment
  const handleAssignStaff = async (orderId: string, staffName: string) => {
    const staff = staffList.find(member => member.name === staffName || member.email === staffName);
    if (!staff) {
      alert('Please select a valid staff member from the live staff roster.');
      return;
    }
    try {
      const updated = await persistOrderOperation({
        orderId,
        assignedStaffId: staff.id,
        assignedStaffName: staff.name,
      });
      setOrders(prev => prev.map(o => o.id === orderId ? { ...o, ...(updated || {}), assignedStaff: staff.name } : o));
      if (selectedOrder?.id === orderId) {
        setSelectedOrder(prev => prev ? { ...prev, ...(updated || {}), assignedStaff: staff.name } : prev);
      }
    } catch (error: any) {
      console.error('[EnterpriseOrderManagement] Staff assignment persistence failed', error);
      alert(error?.message || 'Unable to persist staff assignment.');
    }
  };

  // Notes Updates'''
          if not assign_pat.search(s):
            raise SystemExit('ABORT: exact assignment handler marker not found')
          s = assign_pat.sub(assign_repl, s, count=1)
          
          notes_pat = re.compile(r"  // Notes Updates\n  const handleSaveNotes = \(type: 'admin' \| 'staff' \| 'customer'\) => \{.*?\n  \};\n\n  // Stats Calculations", re.S)
          notes_repl = '''  // Notes Updates
  const handleSaveNotes = async (type: 'admin' | 'staff' | 'customer') => {
    if (!selectedOrder) return;
    const fieldMap = {
      admin: 'adminNotes',
      staff: 'staffNotes',
      customer: 'customerNotes',
    } as const;
    const field = fieldMap[type];
    const noteValue = type === 'admin' ? adminNotes : type === 'staff' ? staffNotes : customerNotes;
    try {
      const updated = await persistOrderOperation({ orderId: selectedOrder.id, [field]: noteValue });
      setOrders(prev => prev.map(o => o.id === selectedOrder.id ? { ...o, ...(updated || {}) } : o));
      setSelectedOrder(prev => prev ? { ...prev, ...(updated || {}) } : prev);
      alert('Note saved successfully.');
    } catch (error: any) {
      console.error('[EnterpriseOrderManagement] Note persistence failed', error);
      alert(error?.message || 'Unable to persist note.');
    }
  };

  // Stats Calculations'''
          if not notes_pat.search(s):
            raise SystemExit('ABORT: exact notes handler marker not found')
          s = notes_pat.sub(notes_repl, s, count=1)
          
          if s == original:
            raise SystemExit('ABORT: no source changes made')
          p.write_text(s, encoding='utf-8')
          print('Guarded patch applied:', len(original), '->', len(s), 'bytes')
      - name: Verify diff and build
        run: |
          git diff --check
          npm ci
          npm run build
      - name: Commit and push verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseOrderManagement.tsx
          git commit -m "fix(staff): bind order operations to authoritative API"
          git push origin audit/dashboard-sync-fix
