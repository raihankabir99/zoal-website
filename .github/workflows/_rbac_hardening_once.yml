name: RBAC Hardening Once

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'fix(rbac): prevent implicit owner escalation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Harden implicit owner assignment
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/security.ts')
          s = p.read_text()
          old = """    // Determine default role (check INITIAL_OWNER_EMAIL logic)\n    let defaultRole = 'customer';\n    const initialOwnerEmail = (process.env.INITIAL_OWNER_EMAIL || 'owner@alzoal.com').trim().toLowerCase();\n    if (userEmail === initialOwnerEmail) {\n      defaultRole = 'owner';\n    } else {\n      // Double check count of owners\n      const { count, error: countError } = await dbClient\n        .from('zoal_users')\n        .select('*', { count: 'exact', head: true })\n        .eq('role', 'owner');\n      if (!countError && count === 0) {\n        defaultRole = 'owner';\n      }\n    }\n"""
          new = """    // SECURITY: profile recovery must never grant owner/admin privileges implicitly.\n    // Privileged roles must be provisioned explicitly; missing profiles default to customer.\n    // INITIAL_OWNER_EMAIL is intentionally not used as an authentication-time privilege grant.\n    const defaultRole = 'customer';\n"""
          if old not in s:
              raise SystemExit('Expected RBAC owner-assignment block not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1))

      - name: Verify hardening is present
        run: |
          grep -n "must never grant owner/admin privileges implicitly" backend/security.ts
          grep -n "const defaultRole = 'customer'" backend/security.ts

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/security.ts
          git commit -m "fix(rbac): prevent implicit owner escalation"
          git push origin audit/dashboard-sync-fix
