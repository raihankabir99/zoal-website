name: One-time CRM hardening

on:
  push:
    branches: [audit/dashboard-sync-fix]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'chore(crm): remove one-time hardening workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch Customer Directory
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/EnterpriseCrm.tsx')
          s = p.read_text()

          # Centralized authenticated request helper; never invent a preview token.
          anchor = "  // --- Filtering & Sorting States for List ---"
          helper = """  const getAuthHeaders = () => {\n    const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';\n    return token ? { Authorization: `Bearer ${token}` } : {};\n  };\n\n"""
          if helper not in s:
              s = s.replace(anchor, helper + anchor, 1)

          # Server is canonical for order aggregates; remove client email-based order reconstruction.
          start = s.index("  // Sync real-time shop orders with the customers database dynamic variables")
          end = s.index("  // CRM Sub tabs", start)
          replacement = """  // Server response is the canonical Customer Directory projection.\n  // Do not reconstruct orders or financial totals client-side.\n  const customersWithOrders = customers;\n\n"""
          s = s[:start] + replacement + s[end:]

          # Remove hard-coded date fixtures from the KPI layer.
          s = s.replace("    const newToday = list.filter(c => c.registrationDate === '2026-07-15' || c.registrationDate === new Date().toISOString().slice(0, 10)).length;", "    const today = new Date().toISOString().slice(0, 10);\n    const newToday = list.filter(c => c.registrationDate === today).length;")

          # Never silently fabricate marketing preferences; null means unknown/unrecorded.
          s = s.replace("result = result.filter(c => !!c.marketingPreferences[filterMarketingSub as keyof typeof c.marketingPreferences]);", "result = result.filter(c => !!c.marketingPreferences && !!c.marketingPreferences[filterMarketingSub as keyof typeof c.marketingPreferences]);")

          # Remove hard-coded chart datasets; render empty state unless data is server supplied.
          s = re.sub(r"  // --- RECHARTS CHART PREPARATIONS ---.*?  // --- FILTERED AND SORTED CUSTOMERS LIST ---", "  // --- RECHARTS CHART PREPARATIONS ---\n  const customerGrowthData: any[] = [];\n  const repeatCustomerData = [\n    { name: 'Single Purchase', value: customersWithOrders.filter(c => c.totalOrders === 1).length },\n    { name: 'Repeat Buyers', value: customersWithOrders.filter(c => c.totalOrders > 1).length },\n    { name: 'Leads (0 Orders)', value: customersWithOrders.filter(c => c.totalOrders === 0).length }\n  ];\n  const revenueByCustomerData = useMemo(() => customersWithOrders.map(c => ({ name: (c.name || '').split(' ')[0], value: c.totalSpending || 0 })).sort((a,b) => b.value-a.value).slice(0,5), [customersWithOrders]);\n  const monthlyRegistrationsData: any[] = [];\n\n  // --- FILTERED AND SORTED CUSTOMERS LIST ---", s, flags=re.S)

          # Do not allow a failed delete request to mutate client state.
          s = s.replace("      } catch (err) {\n        console.error('Error deleting customer:', err);\n        setCustomers(prev => prev.filter(c => c.id !== id));\n      }", "      } catch (err) {\n        console.error('Error deleting customer:', err);\n        alert('Customer deactivation failed. No local state was changed.');\n      }")

          # Notes: only accept server-created records; never fabricate a local note on API failure.
          s = re.sub(r"      const data = res\.ok \? await res\.json\(\) : null;\n      const noteRecord = data\?\.note \|\| \{.*?      \};\n\n      setCustomers\(prev => prev\.map\(c => \{", "      if (!res.ok) {\n        const errData = await res.json().catch(() => ({}));\n        alert(`Error: ${errData.message || errData.error || 'Failed to create note.'}`);\n        return;\n      }\n      const data = await res.json();\n      const noteRecord = data?.note;\n      if (!noteRecord) {\n        alert('Server did not return a persisted note. No local state was changed.');\n        return;\n      }\n\n      setCustomers(prev => prev.map(c => {", s, flags=re.S)

          # Marketing preferences must persist through the authoritative customer API.
          a = s.index("  // Update Individual Marketing Preferences")
          b = s.index("  // Direct Communication Send Dispatch", a)
          marketing = """  // Update Individual Marketing Preferences through the authoritative API.\n  const handleUpdateMarketingPreferences = async (prefKey: string, value: boolean) => {\n    if (!selectedCustomerId) return;\n    try {\n      const token = localStorage.getItem('zoal_auth_token') || sessionStorage.getItem('zoal_auth_token') || '';\n      if (!token) { alert('CRM authentication required.'); return; }\n      const customer = customers.find(c => c.id === selectedCustomerId);\n      const prefs = { ...(customer?.marketingPreferences || {}), [prefKey]: value };\n      const res = await fetch(`/api/admin/customers/${selectedCustomerId}`, {\n        method: 'PATCH',\n        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },\n        body: JSON.stringify({ marketingPreferences: prefs })\n      });\n      if (!res.ok) {\n        const err = await res.json().catch(() => ({}));\n        alert(`Error: ${err.message || err.error || 'Failed to persist marketing preference.'}`);\n        return;\n      }\n      const data = await res.json();\n      if (data.customer) setCustomers(prev => prev.map(c => c.id === selectedCustomerId ? data.customer : c));\n      addLog(`Updated Marketing Preferences for ${selectedCustomer?.name}`, selectedCustomerId);\n    } catch (err) {\n      console.error('Error updating marketing preferences:', err);\n      alert('Marketing preference update failed. No local state was changed.');\n    }\n  };\n\n"""
          s = s[:a] + marketing + s[b:]

          # Reviews have no authoritative CRM review mutation endpoint in this module; fail closed.
          a = s.index("  // Moderation of Reviews left by Customer")
          b = s.index("  // Submit Outreach Form", a)
          reviews = """  // Review moderation is intentionally fail-closed until an authoritative review API is wired.\n  const handleUpdateReviewStatus = (_reviewId: string, _action: 'approve' | 'reject', _replyText?: string) => {\n    alert('Review moderation is not available from Customer Directory until the authoritative review backend is connected.');\n  };\n\n"""
          s = s[:a] + reviews + s[b:]

          # Synthetic purchase/support/reward/redeem handlers must never change local CRM state.
          for marker, next_marker, body in [\n              ("  // Simulate Large Purchase (>5,000 SAR)", "  // Simulate Support Request", "  const handleSimulateLargePurchase = () => alert('Simulation disabled: customer financial events must originate from the authoritative Orders/Checkout system.');\n\n"),\n              ("  // Simulate Support Request", "  // Grant Birthday Reward", "  const handleSimulateSupportRequest = () => alert('Simulation disabled: support events must originate from the authoritative Support system.');\n\n"),\n              ("  // Grant Birthday Reward", "  // Redeem Loyalty Reward", "  const handleGrantBirthdayReward = () => alert('Birthday reward mutation is disabled here until an authoritative loyalty/rewards endpoint is connected.');\n\n"),\n          ]:\n              if marker in s and next_marker in s:\n                  a=s.index(marker); b=s.index(next_marker,a); s=s[:a]+body+s[b:]

          a = s.index("  // Redeem Loyalty Reward")
          b = s.index("  // --- BULK OPERATIONS ENGINE ---", a)
          s = s[:a] + "  const handleRedeemLoyaltyReward = (_rewardId: string, _pointsCost: number) => {\n    alert('Loyalty reward redemption is disabled here until an authoritative loyalty/rewards endpoint is connected.');\n  };\n\n" + s[b:]

          # Remove the client-side RBAC simulator. Role must come from authenticated identity.
          s = s.replace("  // Localized RBAC Override Simulator for Preview/Reviewers\n  const [activeRole, setActiveRole] = useState<string>(() => {\n    return currentUser?.role || 'admin';\n  });\n\n  const isStaff = activeRole === 'staff';\n  const isAdmin = activeRole === 'admin';", "  const activeRole = currentUser?.role || '';\n  const isStaff = activeRole === 'staff';\n  const isAdmin = activeRole === 'admin' || activeRole === 'owner' || activeRole === 'manager';")

          # Remove hard-coded add-form defaults that invent customer data.
          s = s.replace("          city: 'Branch A',\n          country: 'Saudi Arabia',\n          gender: 'Male',\n          birthday: '',\n          language: 'Arabic'", "          city: '',\n          country: '',\n          gender: '',\n          birthday: '',\n          language: ''")

          p.write_text(s)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EnterpriseCrm.tsx
          git commit -m "fix(crm): remove synthetic customer directory behavior" || true
          git push origin audit/dashboard-sync-fix
          git rm .github/workflows/one-time-crm-hardening.yml
          git commit -m "chore(crm): remove one-time hardening workflow"
          git push origin audit/dashboard-sync-fix
