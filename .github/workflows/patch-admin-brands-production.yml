name: Patch Admin Brands Production

on:
  push:
    branches: [audit/dashboard-sync-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
          fetch-depth: 0

      - name: Patch authoritative brands flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin = Path('src/components/AdminDashboard.tsx')
          text = admin.read_text()

          old = re.search(r"  // Local state for brands\n  const \[brands, setBrands\] = useState<any\[\]>\(\(\) => \{.*?\n  \}\);", text, re.S)
          if not old:
              raise SystemExit('brands state block not found')

          replacement = '''  // Authoritative brands state: production data comes from /api/brands.
  const [brands, setBrandsState] = useState<any[]>([]);
  const [brandsLoadState, setBrandsLoadState] = useState<'loading' | 'ready' | 'failed'>('loading');

  const toApiBrand = (brand: any) => ({
    id: brand.id,
    name: brand.name,
    slug: brand.slug,
    description: brand.description || '',
    logo_url: brand.logoUrl || '',
    name_ar: brand.nameAr || null,
    cover_banner_url: brand.coverBannerUrl || null,
    country: brand.country || null,
    website: brand.website || null,
    support_email: brand.supportEmail || null,
    support_phone: brand.supportPhone || null,
    brand_story: brand.brandStory || null,
    brand_story_ar: brand.brandStoryAr || null,
    featured_toggle: !!brand.featuredToggle,
    status: brand.status || 'Published',
    seo_title: brand.seoTitle || null,
    seo_description: brand.seoDescription || null,
    seo_keywords: brand.seoKeywords || null,
    canonical_url: brand.canonicalUrl || null,
    open_graph_image: brand.openGraphImage || null,
    structured_data: typeof brand.structuredData === 'string' && brand.structuredData.trim()
      ? (() => { try { return JSON.parse(brand.structuredData); } catch { return null; } })()
      : (brand.structuredData || null),
    gallery_images: Array.isArray(brand.galleryImages) ? brand.galleryImages : [],
    brand_videos: Array.isArray(brand.brandVideos) ? brand.brandVideos : []
  });

  const fromApiBrand = (brand: any) => ({
    id: brand.id,
    name: brand.name,
    nameAr: brand.name_ar || '',
    slug: brand.slug,
    logoUrl: brand.logo_url || '',
    coverBannerUrl: brand.cover_banner_url || '',
    description: brand.description || '',
    descriptionAr: brand.description_ar || '',
    country: brand.country || '',
    website: brand.website || '',
    supportEmail: brand.support_email || '',
    supportPhone: brand.support_phone || '',
    brandStory: brand.brand_story || '',
    brandStoryAr: brand.brand_story_ar || '',
    featuredToggle: !!brand.featured_toggle,
    status: brand.status || 'Published',
    seoTitle: brand.seo_title || '',
    seoDescription: brand.seo_description || '',
    seoKeywords: brand.seo_keywords || '',
    canonicalUrl: brand.canonical_url || '',
    openGraphImage: brand.open_graph_image || '',
    structuredData: brand.structured_data ? JSON.stringify(brand.structured_data, null, 2) : '',
    galleryImages: Array.isArray(brand.gallery_images) ? brand.gallery_images : [],
    brandVideos: Array.isArray(brand.brand_videos) ? brand.brand_videos : [],
    createdAt: brand.created_at || new Date().toISOString()
  });

  const refreshBrands = async () => {
    setBrandsLoadState('loading');
    try {
      const response = await fetch('/api/brands', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Brands request failed (${response.status})`);
      const payload = await response.json();
      if (!payload?.success || !Array.isArray(payload.data)) throw new Error('Invalid brands response');
      setBrandsState(payload.data.map(fromApiBrand));
      setBrandsLoadState('ready');
    } catch (error) {
      console.error('Failed to load authoritative brands:', error);
      setBrandsState([]);
      setBrandsLoadState('failed');
    }
  };

  useEffect(() => { refreshBrands(); }, []);

  const updateBrands = (updater: React.SetStateAction<any[]>) => {
    setBrandsState(previous => {
      const next = typeof updater === 'function' ? (updater as (value: any[]) => any[])(previous) : updater;
      const previousById = new Map(previous.map(b => [String(b.id), b]));
      const nextById = new Map(next.map(b => [String(b.id), b]));

      // Fire-and-forget persistence; UI remains responsive but failures trigger a server refresh.
      void (async () => {
        try {
          for (const oldBrand of previous) {
            if (!nextById.has(String(oldBrand.id))) {
              const response = await fetch(`/api/brands?id=${encodeURIComponent(oldBrand.id)}`, { method: 'DELETE' });
              if (!response.ok) throw new Error(`Delete failed (${response.status})`);
            }
          }
          for (const brand of next) {
            const method = previousById.has(String(brand.id)) ? 'PUT' : 'POST';
            const response = await fetch('/api/brands', {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(toApiBrand(brand))
            });
            if (!response.ok) throw new Error(`${method} failed (${response.status})`);
          }
          setBrandsLoadState('ready');
        } catch (error) {
          console.error('Failed to persist brand change:', error);
          await refreshBrands();
        }
      })();
      return next;
    });
  };'''

          text = text[:old.start()] + replacement + text[old.end():]
          text = text.replace('setBrands(prev =>', 'updateBrands(prev =>')
          text = text.replace('setBrands={setBrands}', 'setBrands={updateBrands}')
          admin.write_text(text)

          helpers = Path('src/app/api/helpers.ts')
          h = helpers.read_text()
          h = h.replace("allowedRoles: ('customer' | 'staff' | 'admin')[]", "allowedRoles: ('customer' | 'staff' | 'admin' | 'owner' | 'manager')[]")
          helpers.write_text(h)
          PY

          cat > src/app/api/brands/route.ts <<'EOF'
          import { NextRequest } from 'next/server';
          import { supabase, checkRateLimit, apiResponse, apiError, verifyAuthAndRole } from '../helpers';

          const ADMIN_ROLES = ['admin', 'owner', 'manager'] as const;

          const normalizeBrandPayload = (body: any) => ({
            name: String(body.name || '').trim(),
            slug: String(body.slug || '').trim(),
            description: body.description ?? '',
            logo_url: body.logo_url ?? '',
            name_ar: body.name_ar ?? null,
            cover_banner_url: body.cover_banner_url ?? null,
            country: body.country ?? null,
            website: body.website ?? null,
            support_email: body.support_email ?? null,
            support_phone: body.support_phone ?? null,
            brand_story: body.brand_story ?? null,
            brand_story_ar: body.brand_story_ar ?? null,
            featured_toggle: Boolean(body.featured_toggle),
            status: body.status ?? 'Published',
            seo_title: body.seo_title ?? null,
            seo_description: body.seo_description ?? null,
            seo_keywords: body.seo_keywords ?? null,
            canonical_url: body.canonical_url ?? null,
            open_graph_image: body.open_graph_image ?? null,
            structured_data: body.structured_data ?? null,
            gallery_images: Array.isArray(body.gallery_images) ? body.gallery_images : [],
            brand_videos: Array.isArray(body.brand_videos) ? body.brand_videos : []
          });

          export async function GET(req: NextRequest) {
            if (!checkRateLimit(req)) return apiError('Too many requests', 429);
            const { data, error } = await supabase.from('zoal_brands').select('*').order('name', { ascending: true });
            if (error) return apiError(error.message, 500);
            return apiResponse(data || []);
          }

          export async function POST(req: NextRequest) {
            if (!checkRateLimit(req)) return apiError('Too many requests', 429);
            const { error: authError } = await verifyAuthAndRole(req, [...ADMIN_ROLES]);
            if (authError) return authError;
            try {
              const body = await req.json();
              const payload = normalizeBrandPayload(body);
              if (!payload.name || !payload.slug) return apiError('Missing brand name or slug credentials', 400);
              const { data, error } = await supabase.from('zoal_brands').insert(payload).select().single();
              if (error) return apiError(error.message, 500);
              return apiResponse(data, 201);
            } catch (err: any) {
              return apiError(err?.message || 'Server error', 500);
            }
          }

          export async function PUT(req: NextRequest) {
            if (!checkRateLimit(req)) return apiError('Too many requests', 429);
            const { error: authError } = await verifyAuthAndRole(req, [...ADMIN_ROLES]);
            if (authError) return authError;
            try {
              const body = await req.json();
              const id = String(body.id || '').trim();
              if (!id) return apiError('Brand id is required', 400);
              const payload = normalizeBrandPayload(body);
              if (!payload.name || !payload.slug) return apiError('Missing brand name or slug credentials', 400);
              const { data, error } = await supabase.from('zoal_brands').update(payload).eq('id', id).select().single();
              if (error) return apiError(error.message, 500);
              return apiResponse(data);
            } catch (err: any) {
              return apiError(err?.message || 'Server error', 500);
            }
          }

          export async function DELETE(req: NextRequest) {
            if (!checkRateLimit(req)) return apiError('Too many requests', 429);
            const { error: authError } = await verifyAuthAndRole(req, [...ADMIN_ROLES]);
            if (authError) return authError;
            const id = req.nextUrl.searchParams.get('id');
            if (!id) return apiError('Brand id is required', 400);
            const { error } = await supabase.from('zoal_brands').delete().eq('id', id);
            if (error) return apiError(error.message, 500);
            return apiResponse({ id, deleted: true });
          }
          EOF

          npm run build

      - name: Commit verified patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-admin-brands-production.yml
          git add src/components/AdminDashboard.tsx src/app/api/helpers.ts src/app/api/brands/route.ts
          git commit -m "fix: make admin brands authoritative and persistent"
          git push origin audit/dashboard-sync-fix
