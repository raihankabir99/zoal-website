name: One-time KPI Manager Fix
on:
  push:
    branches: [audit/dashboard-sync-fix]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(kpi): align manager authorization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix
      - name: Apply exact guarded route patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.ts')
          s = p.read_text(encoding='utf-8')
          old = "app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.getKpiData);\napp.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.setKpiTarget);\napp.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin']), kpiModule.deleteKpiTarget);"
          new = "app.get('/api/kpi', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.getKpiData);\napp.post('/api/kpi/targets', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.setKpiTarget);\napp.delete('/api/kpi/targets/:id', authenticateRequest, requireRole(['owner', 'admin', 'manager']), kpiModule.deleteKpiTarget);"
          if old not in s:
              raise SystemExit('Guard failed: KPI route block changed or is already fixed; refusing to modify app.ts.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify exact change
        run: |
          grep -n "app.get('/api/kpi'" app.ts
          grep -n "app.post('/api/kpi/targets'" app.ts
          grep -n "app.delete('/api/kpi/targets/:id'" app.ts
          git diff --check
      - name: Build verification
        run: |
          npm ci
          npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-kpi-manager-fix.yml
          git add app.ts .github/workflows/one-time-kpi-manager-fix.yml
          git diff --cached --check
          git commit -m 'fix(kpi): align manager authorization'
          git push origin audit/dashboard-sync-fix
