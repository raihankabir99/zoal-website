name: One-time Support Auth Hardening

on:
  push:
    branches:
      - audit/dashboard-sync-fix

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-sync-fix

      - name: Apply exact customer ownership hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server/support.ts')
          s = p.read_text()
          replacements = {
              "query = query.or(`customer_id.eq.${user.id},customer_email.eq.${user.email}`);": "query = query.eq('customer_id', user.id);",
              "if (ticket.customer_id !== user.id && ticket.customer_email !== user.email) {": "if (ticket.customer_id !== user.id) {",
          }
          changed = 0
          for old, new in replacements.items():
              count = s.count(old)
              print(f'pattern count: {count} -> {old}')
              if count < 1:
                  raise SystemExit(f'Expected at least 1 occurrence, found {count}')
              s = s.replace(old, new)
              changed += count
          if changed < 3:
              raise SystemExit(f'Expected at least 3 hardened authorization occurrences, changed {changed}')
          p.write_text(s)
          PY

          if grep -n "ticket.customer_email !== user.email\|customer_id.eq.*customer_email.eq" server/support.ts; then
            echo 'Unsafe customer-email authorization fallback remains.'
            exit 1
          fi

      - name: Typecheck/build validation
        run: |
          npm ci
          npm run build

      - name: Commit hardened support authorization and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-support-auth-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/support.ts .github/workflows/one-time-support-auth-hardening.yml
          git diff --cached --check
          git diff --cached -- server/support.ts
          git commit -m "fix(support): enforce customer-id ticket ownership"
          git push origin audit/dashboard-sync-fix

# Final retry; self-removes after validation.